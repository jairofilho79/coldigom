praise_id: 6efb5ccb-79b4-4219-bae1-5c582676592b
praise_name: Andando em espírito (Fruto do Espírito)
praise_number: '148'
praise_author: C.M.V.C.S.
praise_rhythm: Balada
praise_tonality: D
praise_category: Crianças e Adolescentes
praise_lyrics: "ANDANDO EM ESPÍRITO \nVENCEREI A TENTAÇÃO,\nAGRADAREI A DEUS\nEM PERFEITA\
  \ COMUNHÃO,\n\n\"POIS O FRUTO DO ESPÍRITO É:\nAMOR, GOZO, PAZ,\nLONGANIMIDADE, BENIGNIDADE,\n\
  BONDADE, FÉ, MANSIDÃO, TEMPERANÇA”.\n\nFINAL 2X\nVIVENDO EM ESPÍRITO,\nANDANDO EM\
  \ ESPÍRITO,\nASSIM SOMOS SERVOS FIÉIS DE CRISTO.\n"

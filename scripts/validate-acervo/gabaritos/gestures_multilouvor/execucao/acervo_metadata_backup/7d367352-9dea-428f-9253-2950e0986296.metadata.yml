praise_id: 7d367352-9dea-428f-9253-2950e0986296
praise_name: Jesus viu a multidão (A multiplicação)
praise_number: '071'
praise_author: M.L.M.B.O.
praise_rhythm: Fox
praise_tonality: Bm
praise_category: Crianças e Adolescentes
praise_lyrics: 'JESUS VIU A MULTIDÃO

  E NÃO OS DEIXOU IR

  ESTAVAM TÃO FAMINTOS,

  COMO PODIAM PARTIR?

  ENTÃO ELE ORDENOU;

  "DAI-LHES DE COMER",

  OS DISCÍPULOS PERGUNTARAM:

  SENHOR, O QUE VAMOS FAZER?

  /INSTRUMENTOS


  CINCO PÃES E DOIS PEIXINHOS

  CINCO MIL ALIMENTOU,

  ASSENTADOS SOBRE A RELVA,

  TODO O POVO SE FARTOU.


  FINAL 2X

  JESUS É A SOLUÇÃO,

  ELE É A PROVISÃO,

  O FILHO DO DEUS VIVO

  FAZ A MULTIPLICAÇÃO.

  '

praise_name: Do pão do céu
praise_number: 095
praise_author: Autor Desconhecido
praise_rhythm: Básico
praise_tonality: C
praise_category: Crianças e Adolescentes
praise_lyrics: 'DO PÃO DO CÉU ME NUTRIREI,

  DA FONTE ETERNA BEBEREI;

  "E QUEM BEBER," NOS DIZ JESUS,

  "JAMAIS DE SEDE SOFRERÁ."


  CANTAR 2X

  NÃO MAIS SEDE? QUE DIZEIS?

  NÃO MAIS SEDE, ASSIM SERÁ!

  /"E QUEM BEBER," NOS DIZ JESUS,

  "JAMAIS DE SEDE SOFRERÁ."

  SEDE NÃO TERÁ!

  '

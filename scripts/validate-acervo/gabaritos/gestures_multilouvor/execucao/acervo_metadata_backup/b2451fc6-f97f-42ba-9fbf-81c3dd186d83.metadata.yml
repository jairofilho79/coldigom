praise_id: b2451fc6-f97f-42ba-9fbf-81c3dd186d83
praise_name: A tua palavra é semente
praise_number: '174'
praise_author: Autor Desconhecido
praise_rhythm: Balada
praise_tonality: G
praise_category: Crianças e Adolescentes
praise_lyrics: 'A TUA PALAVRA É SEMENTE

  E TU ÉS O SEMEADOR,

  O MEU CORAÇÃO É A TERRA

  QUE TU SEMEASTE, SENHOR.


  CORO

  A TUA PALAVRA, A TUA PALAVRA,

  A TUA PALAVRA, SENHOR;

  A TUA PALAVRA, A TUA PALAVRA,

  A TUA PALAVRA É AMOR.


  MEDITANDO EU CERTO DIA

  NA TUA PALAVRA, SENHOR,

  SENTI QUE DO ALTO DESCIA

  A GRAÇA DO CONSOLADOR.

  '

praise_id: 4e493d47-00d8-4ee4-be09-cda7cabfe787
praise_name: Onde quer que tu fores, irei Jesus
praise_number: '025'
praise_author: E.H.M.R.
praise_rhythm: Country
praise_tonality: Em
praise_category: Crianças e Adolescentes
praise_lyrics: 'ONDE QUER QUE TU FORES IREI, JESUS,

  A TI MINH''ALMA JÁ DEI;

  SOU PARTE DO TEU CORPO,

  PERTENÇO AO TEU POVO,

  TU ÉS MEU REMIDOR.


  CORO

  A TUA PALAVRA ALIMENTA A ALMA DO PECADOR,

  COLHEMOS EM TEU CAMPO, TRIGO, Ó SENHOR,

  DELÍCIAS EM TUA MESA E CÂNTICOS DE LOUVOR;

  ALEGRO-ME CONTIGO, TU ÉS MEU REMIDOR.


  AJOELHO-ME A TEUS PÉS,

  AGRADEÇO A SALVAÇÃO

  QUE DE GRAÇA RECEBI, MEU SENHOR;

  TUA VOZ É PODEROSA,

  ORDENAS BÊNÇÃOS PARA MIM.

  E ME CONFORTAS NOS TEUS BRAÇOS DE AMOR.

  '

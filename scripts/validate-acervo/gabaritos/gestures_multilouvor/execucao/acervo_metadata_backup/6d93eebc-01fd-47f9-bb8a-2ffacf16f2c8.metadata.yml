praise_id: 6d93eebc-01fd-47f9-bb8a-2ffacf16f2c8
praise_name: Dá-me um coração cheio do teu amor
praise_number: '163'
praise_author: M.L.M.B.O.
praise_rhythm: Básico
praise_tonality: C
praise_category: Crianças e Adolescentes
praise_lyrics: 'DÁ-ME UM CORAÇÃO

  CHEIO DO TEU AMOR,

  QUE SEMPRE RECONHEÇA

  TUA BONDADE, Ó MEU SENHOR.


  UM CORAÇÃO QUE ESTREMEÇA

  AO OUVIR TUA VOZ ASSIM

  E QUE NUNCA SE ESQUEÇA

  O QUE TU FAZES POR MIM.


  CANTAR 2X

  UM CORAÇÃO OBEDIENTE

  À TUA REVELAÇÃO,

  PURO E RENOVADO

  PELA TUA SALVAÇÃO.

  /FINAL

  Ó SENHOR, AMÉM.

  '

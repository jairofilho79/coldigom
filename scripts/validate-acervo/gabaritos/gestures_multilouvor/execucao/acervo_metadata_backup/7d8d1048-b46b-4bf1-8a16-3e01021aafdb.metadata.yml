praise_name: Vem para o meio (Águas de salvação)
praise_number: 068
praise_author: E.H.M.R.
praise_rhythm: Country
praise_tonality: G
praise_category: Crianças e Adolescentes
praise_lyrics: 'VEM PARA O MEIO

  DE UM POVO QUE SABE

  O CAMINHO DA ETERNIDADE,

  ONDE A PROFECIA APONTA A DIREÇÃO;

  ESSE POVO SEGUE E ALCANÇA SALVAÇÃO.


  VEM PARA O MEIO, JESUS ESTÁ AQUI.

  MERGULHA NESSAS ÁGUAS DA SALVAÇÃO;

  ESSAS ÁGUAS CURAM E NOVA CRIATURA

  SERÁS, ENTÃO, PARA O LOUVOR DE DEUS.

  /INSTRUMENTOS


  VEM PARA O MEIO


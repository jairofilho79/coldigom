praise_id: 65e0e291-6bf2-4d00-80c8-e00fd5798ef8
praise_name: Igreja, corpo de Cristo
praise_number: '190'
praise_author: S.G.D.
praise_rhythm: Guarânia
praise_tonality: C
praise_category: Crianças e Adolescentes
praise_lyrics: 'IGREJA, CORPO DE CRISTO,

  FOSTE COMPRADA COM O SEU SANGUE,

  A TI EU PERTENÇO,

  JESUS JÁ ME SALVOU.


  CORO

  MINHA IGREJA É GLORIOSA,

  É A NOIVA DO SENHOR,

  JESUS VEM, SIM, BUSCÁ-LA,

  EU VOU COM O SENHOR.


  QUERES TU SUBIR TAMBÉM?

  VEM DEPRESSA PARA JESUS,

  ELE TE ESPERA COM AMOR,

  VEM, VEM, DEPRESSA VEM.


  FINAL

  JESUS VEM, SIM, BUSCÁ-LA,

  ORA VEM, SENHOR JESUS.

  '

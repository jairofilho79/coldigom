name = "coldigom-api"
main = "src/index.ts"
compatibility_date = "2024-01-01"
node_compat = true

# D1 Database binding
[[d1_databases]]
binding = "DB"              # Variable name in code (c.env.DB)
database_name = "coldigom" # Name in Cloudflare dashboard
database_id = "YOUR_D1_DATABASE_ID"  # Get from: wrangler d1 create coldigom

# R2 Bucket binding
[[r2_buckets]]
binding = "ASSETS"          # Variable name in code (c.env.ASSETS)
bucket_name = "coldigom-assets"  # Name in Cloudflare dashboard

# Dev configuration (local development)
[dev]
port = 8787
local_protocol = "http"

# Build configuration
build.command = "npx tsc"

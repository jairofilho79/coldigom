praise_id: edce03a8-2eb8-4029-9002-f29af4c40cef
praise_name: A igreja que ora é vitoriosa
praise_number: '146'
praise_author: E.H.M.R.
praise_rhythm: Fox
praise_tonality: D
praise_category: Crianças e Adolescentes
praise_lyrics: 'A IGREJA QUE ORA É VITORIOSA,

  SEMPRE ESTÁ NA DEPENDÊNCIA DO SENHOR;

  A IGREJA QUE ORA É VITORIOSA,

  MUITOS MILAGRES ACONTECEM.

  /CANTAR 2X

  PORQUE É UM CORPO VIVO

  ONDE O CABEÇA É JESUS.


  SE UMA BENÇÃO QUER

  DOBRA OS SEUS JOELHOS,

  CLAMA, ORA, BUSCA SUA FACE;

  ORANDO, CANTANDO, VERÁS

  O FRUTO DO ESPÍRITO SANTO.

  '

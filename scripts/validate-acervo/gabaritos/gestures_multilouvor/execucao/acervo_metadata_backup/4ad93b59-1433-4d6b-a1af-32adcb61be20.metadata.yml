praise_id: 4ad93b59-1433-4d6b-a1af-32adcb61be20
praise_name: Existe um lugar
praise_number: 080
praise_author: M.M.F.
praise_rhythm: Valsa
praise_tonality: C
praise_category: Crianças e Adolescentes
praise_lyrics: 'EXISTE UM LUGAR

  QUE MEU JESUS FOI PREPARAR.

  SE VOCÊ QUISER CHEGAR LÁ,

  É SÓ A ELE SE ENTREGAR.

  ESSE LUGAR É O CÉU DE LUZ,

  ONDE HABITA O MEU JESUS.

  SE QUISER PAZ, ALEGRIA E PERDÃO,

  ENTREGUE A ELE O SEU CORAÇÃO.

  '

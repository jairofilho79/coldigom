praise_id: 1c421f64-e74f-499c-a1c3-dc1f8360d078
praise_name: Deus ama você
praise_number: 079
praise_author: J.J.G.
praise_rhythm: Fox
praise_tonality: E
praise_category: Crianças e Adolescentes
praise_lyrics: 'DEUS AMA VOCÊ E ELE QUER LHE SALVAR,

  ELE VAI OPERAR EM SEU CORAÇÃO.

  A VIDA QUE UM DIA VOCÊ NÃO CONHECIA,

  GOZO, PAZ E ALEGRIA EM JESUS ENCONTROU.


  CANTAR 2X

  ELE É O CAMINHO,

  A VERDADE E A VIDA

  E OFERECE A VOCÊ SALVAÇÃO.

  BASTA ABRIR A PORTA DO CORAÇÃO,

  PRA SENTIR A SUA PAZ E PERDÃO.

  /FINAL

  PRA SENTIR A SUA PAZ E PERDÃO.

  '

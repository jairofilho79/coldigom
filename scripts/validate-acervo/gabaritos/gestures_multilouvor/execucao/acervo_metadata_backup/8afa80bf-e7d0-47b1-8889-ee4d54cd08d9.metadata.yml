praise_id: 8afa80bf-e7d0-47b1-8889-ee4d54cd08d9
praise_name: Em breve estaremos na glória
praise_number: '195'
praise_author: E.H.M.R.
praise_rhythm: Marcha
praise_tonality: Dm
praise_category: Crianças e Adolescentes
praise_lyrics: "EM BREVE ESTAREMOS NA GLÓRIA,\nA CANTAR: ALELUIA AO CORDEIRO,\nAGUARDAMOS\
  \ DIA E NOITE OUVIR O TOQUE\nDA TROMBETA DE DEUS ECOAR.\n\nVAMOS TER UMA GRANDE\
  \ REUNIÃO\nNO CÉU COM O SALVADOR.\nO MOMENTO SE APROXIMA\nE A NOIVA SE APRONTA,\n\
  AGUARDA O CHAMADO DO SENHOR.\n\nCANTAR 2X\nFELIZES SERVOS CHAMADOS\nPARA A GRANDE\
  \ FESTA            \nQUE ACONTECERÁ BREVEMENTE:\nSERÃO AS BODAS DO CORDEIRO.\n/FINAL\n\
  SERÃO AS BODAS DO CORDEIRO.\n"

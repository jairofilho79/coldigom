praise_id: 757d19e4-7c07-46ba-99ef-6e97611c9621
praise_name: Perdoa-me, Senhor
praise_number: '006'
praise_author: J.J.G.
praise_rhythm: Básico
praise_tonality: G
praise_category: Crianças e Adolescentes
praise_lyrics: 'PERDOA-ME, SENHOR,

  CLAMO PELO SANGUE DE JESUS;

  QUERO RENOVAR A MINHA COMUNHÃO.

  PERDOA-ME, SENHOR,

  QUERO DEPOSITAR O MEU CORAÇÃO

  SEMPRE EM TEU ALTAR.


  VISITA-ME COM O TEU ESPÍRITO

  E FAZE-ME HABITAR

  AO TEU LADO ETERNAMENTE!

  '

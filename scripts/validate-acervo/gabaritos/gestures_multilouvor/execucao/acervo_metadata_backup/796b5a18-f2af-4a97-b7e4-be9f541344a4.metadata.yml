praise_lyrics: 'CANTAR 2X

  QUERES SER FELIZ,

  CONHECER JESUS?

  ELE VAI TE DAR ALEGRIA,

  VIDA E PAZ.

  EU JÁ SOU FELIZ,

  DEI MEU CORAÇÃO

  E JESUS EM MIM VEIO HABITAR

  '

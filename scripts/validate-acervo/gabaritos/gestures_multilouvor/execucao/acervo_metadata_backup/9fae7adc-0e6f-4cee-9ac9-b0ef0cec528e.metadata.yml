praise_name: Jesus, quando me lembro
praise_number: 029
praise_author: C.M.V.
praise_rhythm: Guarânia
praise_tonality: C
praise_category: Crianças e Adolescentes
praise_lyrics: 'JESUS, QUANDO ME LEMBRO

  DO DIA EM QUE A TI ME ENTREGUEI,

  LEMBRO DO CALOR QUE SENTIA

  E DO AMOR QUE ME INVADIA,

  LEMBRO QUE A PALAVRA ABRIA

  E TUA VOZ OUVIA DIZER:

  /FINAL 2X

  "VINDE A MIM, OS CANSADOS E OPRIMIDOS,

  E EU VOS ALIVIAREI."

  '

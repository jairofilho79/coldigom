praise_id: 2762cedd-ed7f-4a2e-8db4-f208d3696a1a
praise_name: Das maravilhas que a Bíblia contém
praise_number: '102'
praise_author: Philip Paul Bliss
praise_rhythm: Balada
praise_tonality: E
praise_category: Crianças e Adolescentes
praise_lyrics: 'DAS MARAVILHAS QUE A BÍBLIA CONTÉM,

  EIS A MAIS LINDA: JESUS ME QUER BEM;

  CHEGO-ME A ELE, NINGUÉM ME DETÉM,

  QUANDO ME LEMBRO DE QUE ME QUER BEM.


  OH! QUE PRAZER! JESUS ME QUER BEM,

  SIM, ME QUER BEM, A TI TAMBÉM;

  OH! QUE PRAZER! JESUS ME QUER BEM,

  SIM, ME QUER BEM, JESUS.

  '

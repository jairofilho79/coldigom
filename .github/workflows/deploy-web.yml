name: Deploy Web to Pages

on:
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - '.github/workflows/deploy-web.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy Web Pages
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: ./web
        run: npm ci

      - name: Build
        working-directory: ./web
        run: npm run build
        env:
          # Vazio = same-origin, servido pelo proxy das Pages Functions. É o que o
          # api/deploy-frontend.sh sempre fez; o CI apontava direto pro workers.dev
          # e, ao rodar, sobrescreveria produção quebrando o cookie de sessão no
          # Safari/iPhone (workers.dev vira terceiro e o cookie é bloqueado).
          # Explícito de propósito: sem a variável, o fallback de api.ts é
          # http://localhost:8787 e o build de produção sai apontando pra localhost.
          VITE_API_URL: ""

      - name: Testes com cobertura (bloqueia o deploy)
        working-directory: ./web
        run: npm run test:coverage

      - name: Deploy to Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 246ee6c20c011ae98a226d48a7a38902
          workingDirectory: ./web
          command: pages deploy dist --project-name=coldigom-web --branch=main

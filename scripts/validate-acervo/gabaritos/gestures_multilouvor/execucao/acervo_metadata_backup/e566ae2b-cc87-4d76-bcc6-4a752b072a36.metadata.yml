praise_id: e566ae2b-cc87-4d76-bcc6-4a752b072a36
praise_name: Vou caminhando pra Jerusalém
praise_number: '134'
praise_author: E.H.M.R.
praise_rhythm: Country
praise_tonality: E
praise_category: Crianças e Adolescentes
praise_lyrics: 'VOU CAMINHANDO PRA JERUSALÉM,

  A CADA DIA CHEGO MAIS PERTO,

  QUEM ME CONDUZ É O MEU JESUS,

  POIS NO CLAMOR SEU SANGUE LIMPA

  E ANDO NA LUZ;


  E TENHO ARMAS ESPIRITUAIS:

  A ORAÇÃO, O LOUVOR,

  O JEJUM E MADRUGADA

  E A PALAVRA REVELADA

  QUE ALIMENTA A ALMA,


  E NOS ENSINA A VONTADE DO SENHOR.

  VOU CAMINHANDO PRA JERUSALÉM.

  SE VOCÊ QUISER, VENHA COMIGO TAMBÉM. (2X)

  '

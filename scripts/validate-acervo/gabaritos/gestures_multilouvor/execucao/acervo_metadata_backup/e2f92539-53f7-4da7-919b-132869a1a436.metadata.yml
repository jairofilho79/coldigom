praise_name: Todo ser que tem fôlego
praise_number: '231'
praise_author: C.M.V.
praise_rhythm: Balada
praise_tonality: E
praise_category: Crianças e Adolescentes
praise_lyrics: 'TODO SER QUE TEM FÔLEGO LOUVE,

  LOUVE AO PAI, O SENHOR DOS SENHORES;

  TODO SER QUE TEM FÔLEGO LOUVE,

  LOUVE A JESUS, NOSSO REDENTOR.


  TODO SER QUE TEM FÔLEGO LOUVE,

  LOUVE AO ESPÍRITO SANTO DE DEUS;

  /FINAL 2X

  LOUVE, LOUVE,

  LOUVE COM CÂNTICO NOVO

  E TODO SEU SER.

  '

praise_id: f2b2840c-a4f9-4e9b-ae8b-6809a38756c0
praise_name: Jesus vê a sua igreja
praise_number: '133'
praise_author: E.H.M.R.
praise_rhythm: Fox
praise_tonality: G
praise_category: Crianças e Adolescentes
praise_lyrics: "JESUS VÊ A SUA IGREJA\nCOMO FORTE EDIFÍCIO,\nFIRME E EDIFICADO PARA\
  \ MORADA DE DEUS.\n\nCORO 2X\nNÃO É FEITA DE TIJOLO \nE MADEIRA, NÃO!\nÉ JESUS BEM\
  \ VIVO NO CORAÇÃO.\n\nEDIFÍCIO ESPECIAL\nDESENHADO POR JESUS,\nPARA SEMPRE ERGUIDO\n\
  PELO SANTO ESPÍRITO.\n\nVENHA PARA A IGREJA,\nVAMOS JUNTOS TRABALHAR.\nNESTA OBRA\
  \ GLORIOSA\nATÉ JESUS VOLTAR.\n"

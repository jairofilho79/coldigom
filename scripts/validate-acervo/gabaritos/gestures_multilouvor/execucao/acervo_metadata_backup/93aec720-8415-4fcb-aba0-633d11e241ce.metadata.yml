praise_category: Crianças e Adolescentes
praise_lyrics: 'ELE VIVE EM MIM, (2X)

  A FLOR DO JARDIM, JESUS, ELE VIVE EM MIM.

  /ELE É O MEU REI, (2X)

  SÓ A ELE SERVIREI, ELE É MEU REI.

  /ELE VAI VOLTAR, (2X)

  VEM A CRISTO SEM TARDAR, ELE VAI VOLTAR.

  '

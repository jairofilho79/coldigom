praise_id: 3c3adcdd-5181-4d65-9825-5080fa670bab
praise_name: Sou um soldado do bom salvador
praise_number: '138'
praise_author: S.G.D.
praise_rhythm: Fox
praise_tonality: D
praise_category: Crianças e Adolescentes
praise_lyrics: "SOU UM SOLDADO \nDO BOM SALVADOR,\nPOR JESUS LUTANDO\nCOM FÉ E AMOR.\n\
  \nESPADA SEGURANDO\nBEM FIRME EM MINHA MÃO,\nA JESUS SEGUINDO\nO GRANDE CAPITÃO.\n\
  \nAO CÉU EU VOU MARCHANDO,\nJESUS ME ESPERA LÁ,\nPRA FRENTE EU VOU ANDANDO,\nAO\
  \ CÉU EU VOU CHEGAR.\n/UM, DOIS, TRÊS, QUATRO.\n\nSOU UM SOLDADO\nDO BOM SALVADOR,\n\
  POR JESUS LUTANDO\nCOM FÉ E AMOR.\n"

praise_lyrics: "NA BATALHA EU ORO AO SENHOR,  \nNA BATALHA EU SUPLICO O SEU FAVOR\
  \  \nE DE JOELHOS EU SOU MAIS QUE VENCEDOR,  \nGLORIFICO A DEUS, QUE ATENDE AO MEU\
  \ CLAMOR.  \n\nBATALHA, ORAÇÃO, VITÓRIA, GLÓRIA A JESUS, (3X)  \nGLORIFICO A DEUS,\
  \ QUE ATENDE AO MEU CLAMOR.  \n\nNA BATALHA EU ORO AO SENHOR,  \nNA BATALHA SUPLICO\
  \ O SEU FAVOR  \nE DE JOELHOS EU SOU MAIS QUE VENCEDOR,  \nGLORIFICO A DEUS, QUE\
  \ ATENDE AO MEU CLAMOR.  \n\nFINAL  \nBATALHA, ORAÇÃO, VITÓRIA, GLÓRIA A JESUS,\
  \ (3X)  \nGLORIFICO A DEUS, QUE ATENDE AO MEU CLAMOR.  \n"

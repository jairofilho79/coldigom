praise_id: 4eeaa652-54b6-48b1-89fa-3090b48c31dd
praise_name: Vai raiar o dia
praise_number: '221'
praise_author: R.E.B.T.
praise_rhythm: Fox
praise_tonality: F
praise_category: Crianças e Adolescentes
praise_lyrics: '*CORO

  VAI RAIAR O DIA,

  DIA DA VITÓRIA.

  VAI RAIAR O DIA,

  DIA EM A VITÓRIA ALCANÇAREMOS.


  GLÓRIA E MAJESTADE

  ESTÃO ANTE A FACE DO SENHOR

  E FORMOSURA NO SEU SANTO LUGAR;

  ANUNCIAI ENTRE AS NAÇÕES

  A SUA GLÓRIA,

  ENTRE OS POVOS

  AS SUAS MARAVILHAS.


  *CORO

  VAI RAIAR O DIA,

  DIA DA VITÓRIA.

  VAI RAIAR O DIA,

  DIA EM A VITÓRIA ALCANÇAREMOS.


  DAI AO SENHOR DEVIDA GLÓRIA,

  TRAZEI OFERTAS E ENTRAI

  NOS SEUS ÁTRIOS;

  ADORAI AO SENHOR EM SANTIDADE,

  COM LOUVOR ADORAI A SUA FACE.


  *CORO

  VAI RAIAR O DIA,

  DIA DA VITÓRIA.

  VAI RAIAR O DIA,

  DIA EM A VITÓRIA ALCANÇAREMOS.


  DAI AO SENHOR A GLÓRIA E FORÇA,

  BRAME O MAR E A SUA PLENITUDE;

  ANUNCIAI A SALVAÇÃO DE DIA EM DIA

  PORQUE EM BREVE

  A VITÓRIA ALCANÇAREMOS.


  *CORO 2X

  VAI RAIAR O DIA,

  DIA DA VITÓRIA.

  VAI RAIAR O DIA,

  DIA EM A VITÓRIA ALCANÇAREMOS.

  '

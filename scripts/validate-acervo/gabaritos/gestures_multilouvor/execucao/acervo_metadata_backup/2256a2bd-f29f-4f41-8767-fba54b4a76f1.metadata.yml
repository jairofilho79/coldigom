praise_id: 2256a2bd-f29f-4f41-8767-fba54b4a76f1
praise_name: Quero ouvir (meu querer)
praise_number: '040'
praise_author: F.T.R.
praise_rhythm: Básico
praise_tonality: F
praise_category: Crianças e Adolescentes
praise_lyrics: 'QUERO OUVIR A TUA VOZ, Ó MEU SENHOR,

  A FALAR TÃO PURA E MEIGA AO CORAÇÃO

  E SENTIR O TOQUE DO TEU SANTO ESPÍRITO

  PRA QUE EU POSSA RENOVAR A COMUNHÃO.


  CORO 2X

  QUERO LOUVAR, COM ALEGRIA EM MEU VIVER

  RENOVAR A MINHA FÉ,

  ENTREGAR TODO O MEU SER.

  /INSTRUMENTOS


  QUERO FALAR DESTE SEU IMENSO AMOR.

  E DIZER A TODO O MUNDO

  QUE JESUS É O SALVADOR.

  QUE LÁ NA CRUZ ELE MORREU

  PRA NOS SALVAR

  DERRAMOU SEU SANGUE PURO

  E A VIDA ETERNA DÁ.

  '

praise_id: 51ba1467-9888-48e1-99cc-1fdd66bc0ee6
praise_name: Uma luz resplandecente
praise_number: '140'
praise_author: C.M.V.
praise_rhythm: Balada
praise_tonality: A
praise_category: Crianças e Adolescentes
praise_lyrics: 'UMA LUZ RESPLANDECENTE

  HÁ EM VOLTA DO TEU OLHAR,

  TUA FACE RELUZENTE

  VEM HOJE ME MOSTRAR.


  SEI QUE UM DIA TU VIRÁS

  E ENTÃO ME LEVARÁS

  ANTES MESMO QUE EU PEÇA:

  SENHOR, VEM ME BUSCAR!


  SEGURA-ME PELA MÃO

  QUANDO A VIDA ATRAVESSAR,

  SEI QUE TU ESTÁS COMIGO

  QUANDO O MAL ME ENCONTRAR.

  '

praise_name: Vou para o meu lar
praise_number: '200'
praise_author: K.D.O.
praise_rhythm: Fox
praise_tonality: D
praise_category: Crianças e Adolescentes
praise_lyrics: 'CORO 2X

  VOU PARA O MEU LAR,

  JESUS JÁ PREPAROU O MEU LUGAR.


  ESTÁ CHEGANDO A HORA DA PARTIDA,

  JESUS JÁ VEM ME BUSCAR.

  A TROMBETA VAI ECOAR

  E VOU PARA O MEU LAR.


  MINHA CANDEIA ESTÁ BEM ACESA

  E ÓLEO NA BOTIJA TAMBÉM HÁ.

  A TROMBETA VAI ECOAR

  E VOU PARA O MEU LAR.

  '

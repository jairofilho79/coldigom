praise_name: Pai, estou a te clamar
praise_number: '002'
praise_author: C.M.V.
praise_rhythm: Fox
praise_tonality: G
praise_category: Clamor
praise_lyrics: 'PAI, ESTOU A TE CLAMAR

  PEDINDO PERDÃO, SOCORRO,

  EU QUERO TE OUVIR.

  PAI, ENSINA-ME A ADORAR

  E A GLORIFICAR TEU NOME,

  EU QUERO TE AMAR.

  PAI, EU QUERO TE SERVIR

  OH! DÁ-ME DA TUA GRAÇA

  E ME BASTARÁ,

  E ME BASTARÁ, E ME BASTARÁ!

  '

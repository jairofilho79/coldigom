praise_id: cbe45953-1bed-4ae5-9438-5182b39e5012
praise_name: Tem bom ânimo, pobre pecador
praise_number: '063'
praise_author: S.G.D.
praise_rhythm: Country
praise_tonality: D
praise_category: Crianças e Adolescentes
praise_lyrics: "TEM BOM ÂNIMO POBRE PECADOR,\nJESUS ESTÁ PRESENTE PARA TE SALVAR;\n\
  SALVOU ZAQUEU, O RICO QUE ERA POBRE,\nBUSCOU UM CEGO À BEIRA DO CAMINHO.\n\nBARTIMEU,\
  \ QUE QUERES QUE EU TE FAÇA?\n/\"QUE EU VEJA!\" \nFOI A RESPOSTA PRONTA;\nVENDO\
  \ AGORA O ROSTO DE JESUS,\nLOGO O SEGUIU LOUVANDO ALEGREMENTE.\n\nPODES TER TUDO\
  \ OU NADA POSSUIR\nJESUS PERGUNTA AGORA:\n\"QUE QUERES QUE EU TE FAÇA?\"\nRESPONDE\
  \ DEPRESSA: A TUA SALVAÇÃO;\nVIDA ETERNA JESUS TE DÁ AGORA.\n"

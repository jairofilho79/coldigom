praise_name: Neste dia especial
praise_number: 085
praise_author: I.B.J.
praise_rhythm: Country
praise_tonality: C
praise_category: Crianças e Adolescentes
praise_lyrics: 'NESTE DIA ESPECIAL,

  VOU LHE APRESENTAR JESUS,

  QUE DISSIPA TODO MAL

  E FAZ RAIAR EM NÓS SUA LUZ.


  CORO

  JESUS É O BOM AMIGO,

  ABRIGO NO TEMPORAL,

  QUE NOS LIVRA DO PERIGO

  E POR NÓS VENCEU O MAL.


  ABRA SEU CORAÇÃO

  E VENHA CONHECER JESUS,

  COM AMOR E SEGURANÇA

  À VIDA ETERNA NOS CONDUZ.


  FINAL

  SIM, POR NÓS VENCEU O MAL.

  '

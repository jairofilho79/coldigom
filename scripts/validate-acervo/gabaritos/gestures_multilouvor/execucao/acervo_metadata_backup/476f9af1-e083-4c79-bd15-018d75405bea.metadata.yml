praise_id: 476f9af1-e083-4c79-bd15-018d75405bea
praise_name: Cristo sente seu amor por mim
praise_number: '100'
praise_author: 'Let.: Anna Bartlett Warner; Trad. Stuart Edmund McNair; Mús. William
  Batchelder Bradbury'
praise_rhythm: Country
praise_tonality: C
praise_category: Crianças e Adolescentes
praise_lyrics: 'CRISTO SENTE AMOR POR MIM,

  COM CERTEZA EU CREIO ASSIM,

  POR AMOR DE MIM MORREU,

  VIVO ESTÁ, POR MIM, NO CÉU.


  CORO

  CRISTO NOS AMA,

  CRISTO NOS CHAMA,

  CRISTO PROCLAMA

  TÃO GRANDE SALVAÇÃO.


  CRISTO TEM POR MIM AMOR

  E SE FEZ MEU SALVADOR,

  HOJE AINDA TEM PRAZER

  EM MENINOS RECEBER.


  POR GOZAR SEU RICO AMOR

  HEI DE AMAR MEU SALVADOR,

  E DESEJO AQUI MOSTRAR

  SEU AMOR TÃO EXEMPLAR.

  '

praise_id: 62f3a6b7-4d1f-4935-9bec-d1dea6bdd2d0
praise_name: Perdoa-me, Senhor, segundo o Seu amor
praise_number: '012'
praise_author: F.S.P.
praise_rhythm: Básico
praise_tonality: C
praise_category: Crianças e Adolescentes
praise_lyrics: 'PERDOA-ME SENHOR, SEGUNDO O SEU AMOR,

  LAVA-ME COM O SANGUE DE JESUS

  E ENVIA A TUA LUZ.

  PURIFICA-ME, SENHOR, COM O SANGUE DE JESUS

  NOVA CRIATURA EM TI EU SOU

  PRONTO PARA O TEU LOUVOR.


  FINAL 2X

  POSSO AGORA TE ADORAR,

  POSSO TE GLORIFICAR,

  MEU CORAÇÃO LIBERTO ESTÁ

  CHEIO DE ALEGRIA E PAZ.

  '

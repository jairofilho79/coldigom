praise_id: 6b1f1585-8b94-4881-89ba-62e078c1411e
praise_name: Nesta batalha não tereis que pelejar
praise_number: '123'
praise_author: I.B.S.A.
praise_rhythm: Fox
praise_tonality: C
praise_category: Crianças e Adolescentes
praise_lyrics: 'NESTA BATALHA NÃO TEREIS QUE PELEJAR;

  AGUARDAI, FICAI PARADOS,

  E VEDE A SALVAÇÃO DO SENHOR

  PARA CONVOSCO, Ó JUDÁ E JERUSALÉM.


  NÃO TEMAIS, NEM VOS ASSUSTEIS;

  AMANHÃ SAÍ-LHES AO ENCONTRO,

  PORQUE O SENHOR SERÁ CONVOSCO.

  NESTA BATALHA NÃO TEREIS QUE PELEJAR.

  '

praise_id: b7d01615-cf1c-41ae-901e-2008a8613dc5
praise_name: Sobre as nuvens Jesus vem
praise_number: '201'
praise_author: C.M.V.C.S.
praise_rhythm: Marcha
praise_tonality: C
praise_category: Crianças e Adolescentes
praise_lyrics: 'SOBRE AS NUVENS JESUS VEM

  COMO REI E VENCEDOR,

  SUA IGREJA VEM BUSCAR

  CUMPRINDO SUA PROMESSA AO SEU POVO.


  CANTAR 2X

  QUE ALEGRIA VER NOSSO REI.

  MARANATA, CANTAREMOS COM FERVOR,

  POIS SEU BRADO É DE VITÓRIA,

  ALELUIA, HONRA E GLÓRIA

  LHE DAREMOS COM AMOR.


  COMO IGREJA FIEL,

  TODOS UNIDOS A UMA VOZ,

  CANTAREMOS JESUS VEM VENCEDOR!

  JESUS VEM VENCEDOR! (2X)

  '

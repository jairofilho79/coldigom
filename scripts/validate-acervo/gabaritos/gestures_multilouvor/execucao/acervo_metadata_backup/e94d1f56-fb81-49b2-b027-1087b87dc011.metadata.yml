praise_id: e94d1f56-fb81-49b2-b027-1087b87dc011
praise_name: Haveremos de chegar
praise_number: '105'
praise_author: Autor Desconhecido
praise_rhythm: Repique
praise_tonality: G
praise_category: Crianças e Adolescentes
praise_lyrics: 'HAVEREMOS DE CHEGAR

  PELO PODER DO SENHOR EM JERUSALÉM;

  ONDE A FELICIDADE

  PARA SEMPRE REINARÁ, EM JERUSALÉM.


  *CORO

  ALELUIA, CANTAREMOS,

  LOUVANDO AO SALVADOR EM JERUSALÉM,

  POIS ALI JAMAIS OS MALES

  PODERÃO NOS ALCANÇAR,

  NA FELIZ JERUSALÉM.

  /INSTRUMENTOS


  QUERES TU TAMBÉM ENTRAR

  COM OS SALVOS POR JESUS EM JERUSALÉM?

  É PRECISO, HOJE MESMO,

  ACEITAR ESSA LUZ, CAMINHANDO À JERUSALÉM.


  *CORO

  ALELUIA, CANTAREMOS,

  LOUVANDO AO SALVADOR EM JERUSALÉM,

  POIS ALI JAMAIS OS MALES

  PODERÃO NOS ALCANÇAR,

  NA FELIZ JERUSALÉM.

  /FINAL

  NA FELIZ JERUSALÉM.

  '

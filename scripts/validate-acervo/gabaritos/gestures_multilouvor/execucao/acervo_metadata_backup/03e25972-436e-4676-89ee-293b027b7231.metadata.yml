praise_id: 03e25972-436e-4676-89ee-293b027b7231
praise_name: Eu quero andar sempre com Jesus
praise_number: '036'
praise_author: E.H.M.R.
praise_rhythm: Fox
praise_tonality: D
praise_category: Crianças e Adolescentes
praise_lyrics: 'EU QUERO ANDAR SEMPRE COM JESUS,

  À ETERNIDADE ELE ME CONDUZ;

  E QUANDO A LUTA TIVER QUE ENFRENTAR

  ELE ESTARÁ A ME PROTEGER.


  SUSTENTA-ME, PEGA A MINHA MÃO,

  LEVANTA-ME, DÁ-ME A SALVAÇÃO;

  CRESCER COM ELE É O MAIOR TESOURO,

  TRABALHAR PRA ELE É A MINHA ADORAÇÃO.

  /FINAL

  TRABALHAR PRA ELE É A MINHA ADORAÇÃO.

  '

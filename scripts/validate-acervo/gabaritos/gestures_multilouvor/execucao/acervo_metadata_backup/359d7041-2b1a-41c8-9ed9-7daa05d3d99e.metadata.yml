praise_id: 359d7041-2b1a-41c8-9ed9-7daa05d3d99e
praise_name: No meu coração há um tesouro (Príncipe da Vida)
praise_number: '037'
praise_author: E.H.M.R.
praise_rhythm: Marcha
praise_tonality: Em
praise_category: Crianças e Adolescentes
praise_lyrics: 'NO MEU CORAÇÃO HÁ UM TESOURO,

  O MAIOR QUE POSSA EXISTIR;

  A MELHOR COISA QUE FIZ FOI ENCONTRÁ-LO

  POIS VIDA ETERNA ADQUIRI.


  CANTAR 2X

  PRINCIPE DA VIDA, PAI DA ETERNIDADE,

  É O MEU TESOURO.

  /FINAL

  É O MEU JESUS.

  '

name = "coldigom-api"
account_id = "ae6f9337c75828a1c114e9ec10119d0f"
main = "dist/index.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# D1 Database binding
[[d1_databases]]
binding = "DB"              # Variable name in code (c.env.DB)
database_name = "coldigom" # Name in Cloudflare dashboard
database_id = "975818ec-73e0-40ca-b110-be9204e13d91"  # Created D1 database

# R2 Bucket binding
[[r2_buckets]]
binding = "ASSETS"          # Variable name in code (c.env.ASSETS)
bucket_name = "coldigom-assets"  # Name in Cloudflare dashboard

# Drive import queue (create once: wrangler queues create drive-import)
[[queues.producers]]
binding = "DRIVE_IMPORT"
queue = "drive-import"

[[queues.consumers]]
queue = "drive-import"
max_batch_size = 5
max_retries = 5
max_concurrency = 3

# OAuth / sessão (não-secret). Secrets via `wrangler secret put` (usar wrangler global 4.x, não npx)
[vars]
AUTH_BASE_URL = "https://coldigom-api.coletaneadigitalicm.workers.dev"
WEB_ORIGIN = "https://coldigom-web.pages.dev"
AUTH_COOKIE_SAMESITE = "None"

# Dev configuration (local development)
[dev]
port = 8787
local_protocol = "http"

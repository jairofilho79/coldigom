praise_id: 990b8102-9e66-4f3b-ae57-fa9390de7a81
praise_name: Ele morreu, mas ressurgiu
praise_number: 090
praise_author: E.C.L.
praise_rhythm: Toada
praise_tonality: B
praise_category: Crianças e Adolescentes
praise_lyrics: "ELE MORREU, MAS RESSURGIU;\nPLENA PAZ ENCHEU O MEU VIVER;\nJESUS É\
  \ TUDO O QUE SEMPRE QUIS,\nJESUS ME TROUXE O SEU PERDÃO.\n\nQUERO FALAR DESTA SALVAÇÃO,\n\
  POR ONDE QUER QUE EU POSSA ANDAR,\nJESUS É TUDO, ELE É A PAZ\nQUE VOCÊ PODE ENCONTRAR.\
  \ (2X)\n/INSTRUMENTOS \n\nCRISTO, O SENHOR, É QUEM ME CONDUZ,\nLIVRA-ME DO MAL E\
  \ DA TENTAÇÃO.\nE O SEU AMOR SEMPRE TRADUZ\nVIDA REAL E O CÉU PRA MIM!\n\nCRISTO\
  \ JESUS É O MEU SENHOR\nSEMPRE PRESENTE NO MEU CORAÇÃO.\nBREVE VIRÁ DO CÉU ME BUSCAR.\n\
  QUE ALEGRIA SERÁ! (2X)\n"

praise_id: af9f7d88-1258-496c-a5fd-72cf9133a10c
praise_name: Jesus me ama
praise_number: '101'
praise_author: Autor Desconhecido
praise_rhythm: Valseado
praise_tonality: C
praise_category: Crianças e Adolescentes
praise_lyrics: 'JESUS ME AMA E QUER SALVAR-ME,

  JESUS ME AMA E QUER-ME BEM.


  CORO

  POR ISSO EU CANTO, SEMPRE ELE AMA,

  JESUS ME AMA, MEU SALVADOR.


  ESTIVE PRESO NO VIL PECADO,

  ESTIVE PRESO, MAS ME SALVOU.


  CASTIGO DURO QUE EU MEREÇO,

  JESUS SOFREU JÁ EM MEU LUGAR.


  AGORA, QUERO NA MINHA VIDA,

  AO MEU AMIGO SEMPRE AGRADAR.

  '

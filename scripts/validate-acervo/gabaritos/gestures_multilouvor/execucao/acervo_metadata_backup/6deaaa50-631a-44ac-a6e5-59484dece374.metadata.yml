praise_id: 6deaaa50-631a-44ac-a6e5-59484dece374
praise_name: Purificado com sangue estou
praise_number: '013'
praise_author: Mr. & Mrs. Seth Sykes
praise_rhythm: Fox
praise_tonality: D
praise_category: Crianças e Adolescentes
praise_lyrics: 'PURIFICADO COM SANGUE ESTOU,

  QUAL NEVE ME TORNOU;

  ÁGUA DA VIDA EM JESUS BEBI,

  SATISFEITO ME SENTI.


  PARA JESUS, LÁ NA CRUZ, EU OLHEI,

  E O MEU FARDO AO CHÃO DEIXEI;

  CANTANDO VOU: GLÓRIA AO SENHOR!

  GLÓRIA A CRISTO, NOSSO DEUS!


  PURIFICADO COM SANGUE ESTOU,

  QUAL NEVE ME TORNOU;

  ÁGUA DA VIDA EM JESUS BEBI,

  SATISFEITO ME SENTI.


  FINAL

  PARA JESUS, LÁ NA CRUZ, EU OLHEI,

  E O MEU FARDO AO CHÃO DEIXEI;

  CANTANDO VOU: GLÓRIA AO SENHOR!

  GLÓRIA A CRISTO, NOSSO DEUS!

  '

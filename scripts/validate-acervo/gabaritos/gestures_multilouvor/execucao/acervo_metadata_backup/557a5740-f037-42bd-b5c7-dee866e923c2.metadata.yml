praise_id: 557a5740-f037-42bd-b5c7-dee866e923c2
praise_name: Certo homem, príncipe dos judeus (Nicodemos)
praise_number: 089
praise_author: A.V.Q.S.
praise_rhythm: Básico
praise_tonality: Cm
praise_category: Crianças e Adolescentes
praise_lyrics: "CERTO HOMEM, PRÍNCIPE DOS JUDEUS,\nFOI AO MESTRE PERGUNTAR-LHE ASSIM:\n\
  BEM SABEMOS QUE ÉS MESTRE\nVINDO DE DEUS.\n\nCOMO PODE ALGUÉM NASCER DE NOVO?\n\
  AQUELE QUE NÃO NASCER DA ÁGUA \nE DO ESPÍRITO\nNÃO PODE VER O REINO DE DEUS.\nMAS\
  \ AQUELE QUE PERMANECER FIEL\nATÉ O FIM, O VERÁ.\n"

praise_id: bcd176bf-f637-4f0c-b82f-983f1c0c1c6a
praise_name: Eu vou contar uma história (Zaqueu)
praise_number: '064'
praise_author: M.L.M.B.O. & F.B.O.G.
praise_rhythm: Country
praise_tonality: D
praise_category: Crianças e Adolescentes
praise_lyrics: 'EU VOU CONTAR UMA HISTÓRIA

  PRA VOCÊ NÃO ESQUECER.

  A HISTÓRIA DE UM HOMEM

  QUE A JESUS QUERIA VER.


  SUBIU EM UMA ÁRVORE

  PRA VER JESUS PASSAR

  POIS ERA TÃO PEQUENO,

  NÃO PODIA O AVISTAR.


  OLHANDO PARA CIMA

  JESUS ENCONTROU,

  COM SUA VOZ SUAVE

  ENTÃO ELE FALOU:


  "ZAQUEU DESCE DEPRESSA

  PORQUE HOJE ME CONVÉM

  POUSAR EM TUA CASA,

  VEM DEPRESSA, Ó SIM, VEM!"


  ZAQUEU ENTÃO DESCEU

  QUANDO JESUS O CONVIDOU,

  JESUS MUDOU SUA VIDA,

  EM OUTRO HOMEM SE TORNOU.

  '

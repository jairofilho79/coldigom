praise_tonality: G
praise_category: Crianças e Adolescentes
praise_lyrics: 'CANTAR 2X

  TUA MÃO É PODEROSA

  E O TEU NOME DOCE AMOR,

  NÃO TE AFASTARÁS DE MIM,

  NEM CONTENDES CONTRA MIM,

  ANTES CUIDARÁS, SENHOR, DE MIM.

  '

praise_name: Senhor, eu te louvarei
praise_number: '235'
praise_author: M.M.F.
praise_rhythm: Fox
praise_tonality: D
praise_category: Crianças e Adolescentes
praise_lyrics: 'SENHOR, EU TE LOUVAREI,

  EM TI ME ALEGRAREI,

  DE TODO O MEU CORAÇÃO

  LOUVORES A TI DAREI.


  POIS TU NOS TENS SUSTENTADO

  COM TUA MÃO DE PODER,

  GOZO E ALEGRIA TENS DADO

  A TODO QUE EM TI CRER.

  '

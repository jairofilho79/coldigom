praise_lyrics: 'QUEM TEM OUVIDOS

  OUÇA O QUE O ESPÍRITO DIZ ÀS IGREJAS;

  QUEM TEM OUVIDOS

  OUÇA O QUE O ESPÍRITO DIZ ÀS IGREJAS.


  JESUS VIRÁ, EM BREVE VIRÁ!

  JESUS VIRÁ, À PORTA ELE ESTÁ!


  QUEM TEM OUVIDOS

  OUÇA O QUE O ESPÍRITO DIZ ÀS IGREJAS.

  /

  GUARDA O QUE TENS PARA QUE NINGUÉM

  TOME A TUA COROA.


  GUARDA O QUE TENS,

  EM BREVE ELE VEM!

  GUARDA O QUE TENS,

  JESUS PRESTO VEM!

  FINAL

  QUEM TEM OUVIDOS

  OUÇA O QUE O ESPÍRITO DIZ ÀS IGREJAS.

  '

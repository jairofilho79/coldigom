praise_id: fe59d2c1-963f-4a86-a755-812a352d52ad
praise_name: O Senhor é quem cuida de mim
praise_number: '114'
praise_author: C.M.V.C.S.
praise_rhythm: Balada
praise_tonality: D
praise_category: Crianças e Adolescentes
praise_lyrics: 'O SENHOR É QUEM CUIDA DE MIM. (2X)

  NADA HEI DE TEMER,

  COM JESUS VOU VENCER,

  POIS EU SEI QUE ELE CUIDA DE MIM.


  A JESUS SERVIREI COM AMOR,

  POIS EU SEI QUE ELE É MEU SALVADOR.

  AO MEU LADO ESTÁ, NUNCA VAI ME DEIXAR,

  POIS EU SEI QUE ELE CUIDA DE MIM.

  '

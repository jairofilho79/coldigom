praise_id: ea260d02-e863-47a7-be4d-e657071045c7
praise_name: E tudo posso naquele que me fortalece
praise_number: '110'
praise_author: C.M.V.
praise_rhythm: Marcha
praise_tonality: C
praise_category: Crianças e Adolescentes
praise_lyrics: 'CORO 2X

  EU TUDO POSSO

  NAQUELE QUE ME FORTALECE.


  CANTAR 2X

  EU VÔO COMO UMA ÁGUIA,

  EU CRUZO MONTANHAS E VALES.


  CANTAR 2X

  EU VENÇO GIGANTES, EU VENÇO LEÕES,

  EU VENÇO OS LOBOS DO MUNDO.


  CANTAR 2X

  EU CREIO NUM DEUS QUE VIVE E REINA,

  EU CREIO NUM DEUS QUE VENCE POR MIM.

  '

name = "coldigom-api"
account_id = "246ee6c20c011ae98a226d48a7a38902"
main = "dist/index.js"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# D1 Database binding
[[d1_databases]]
binding = "DB"              # Variable name in code (c.env.DB)
database_name = "coldigom" # Name in Cloudflare dashboard
database_id = "7186c208-a639-469e-810c-8e7401c16b33"  # D1 coldigom (conta jairofilho79)

# R2 Bucket binding
[[r2_buckets]]
binding = "ASSETS"          # Variable name in code (c.env.ASSETS)
bucket_name = "coldigom-assets"  # Name in Cloudflare dashboard

# Drive import queue (create once: wrangler queues create drive-import)
[[queues.producers]]
binding = "DRIVE_IMPORT"
queue = "drive-import"

[[queues.consumers]]
queue = "drive-import"
max_batch_size = 5
max_retries = 5
max_concurrency = 3

# OAuth / sessão (não-secret). Secrets via `wrangler secret put` (usar wrangler global 4.x, não npx)
[vars]
AUTH_BASE_URL = "https://coldigom-web.pages.dev"
# CSV: coldigom SPA + PLPCG (*plpcg.com cobre plpcg.com, v2.plpcg.com, 120826.plpcg.com, etc.)
WEB_ORIGIN = "https://coldigom-web.pages.dev,https://*plpcg.com,https://plpcg-v2.pages.dev,https://plpcjf.org,https://plpcg-120826.pages.dev"
AUTH_COOKIE_SAMESITE = "Lax"

# Workers AI (fallback ChordPro — binding usado por rotas internas futuras)
[ai]
binding = "AI"

# Dev configuration (local development)
[dev]
port = 8787
local_protocol = "http"

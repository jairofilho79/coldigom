praise_id: 1f64d3d5-6b90-4399-bb0a-96f4070c6bbf
praise_name: Príncipe da paz
praise_number: '032'
praise_author: C.M.V.
praise_rhythm: Balada
praise_tonality: G
praise_category: Crianças e Adolescentes
praise_lyrics: 'PRÍNCIPE DA PAZ, QUERO TE AMAR,

  TEUS MANDAMENTOS, SIM, TODOS GUARDAR;

  Ó DEUS, VEM AJUDAR-ME

  A FAZER TUA VONTADE

  E EM TUDO TEU NOME LOUVAR.


  JESUS REDENTOR, QUERO TE ADORAR

  EM ESPÍRITO E EM VERDADE;

  Ó DEUS, VEM ENSINAR-ME

  A LOUVAR TUA GRANDEZA

  E BENDIZER TEU NOME,

  Ó SENHOR!

  '

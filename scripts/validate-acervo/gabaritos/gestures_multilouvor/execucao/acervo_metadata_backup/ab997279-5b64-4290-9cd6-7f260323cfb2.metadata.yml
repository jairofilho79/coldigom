praise_id: ab997279-5b64-4290-9cd6-7f260323cfb2
praise_name: Na cidade de Davi nasceu o Salvador
praise_number: '233'
praise_author: E.H.M.R.
praise_rhythm: Fox
praise_tonality: A
praise_category: Crianças e Adolescentes
praise_lyrics: 'NA CIDADE DE DAVI NASCEU O SALVADOR,

  CRISTO, O SENHOR;

  MULTIDÕES DE ANJOS

  LOUVARAM A DEUS DIZENDO:


  *CORO 2X

  GLÓRIA A DEUS NAS ALTURAS,

  PAZ NA TERRA,

  BOA VONTADE PARA COM OS HOMENS.


  JESUS NASCEU NUM LUGAR TÃO SIMPLES,

  FOI NO MEU CORAÇÃO;

  ACHOU LUGAR PRA NASCER EM MIM

  POIS ABRI MEU CORAÇÃO

  E AGORA O SIRVO, SIRVO, SIM.


  FINAL 2X

  GLÓRIA A DEUS NAS ALTURAS,

  PAZ NA TERRA,

  BOA VONTADE PARA COM OS HOMENS.

  '

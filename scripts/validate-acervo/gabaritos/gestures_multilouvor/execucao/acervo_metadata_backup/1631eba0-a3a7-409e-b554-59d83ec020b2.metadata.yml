praise_name: Jesus cura e salva
praise_number: 092
praise_author: K.V.L.
praise_rhythm: Básico
praise_tonality: D
praise_category: Crianças e Adolescentes
praise_lyrics: 'JESUS CURA E SALVA,

  JESUS É O MEU SALVADOR;

  JESUS É O MEU AMIGO,

  E ELE É O MEU REDENTOR.


  CANTAR 2X

  QUANDO ESTOU DOENTE, CURA ELE DÁ.

  QUANDO ESTOU TRISTE, A PAZ VEM REINAR.


  FINAL 2X

  JESUS É FORÇA E ESPERANÇA!

  JESUS É O PRÍNCIPE DA PAZ!

  '

praise_id: 164645b1-6fdc-4d6d-bbd9-a3047fe21c6b
praise_name: Irei cantar e adorar o Rei Jesus
praise_number: '226'
praise_author: C.M.V.C.S.
praise_rhythm: Fox
praise_tonality: E
praise_category: Crianças e Adolescentes
praise_lyrics: 'IREI CANTAR E ADORAR

  AO REI JESUS

  QUE POR AMOR MORREU

  NA CRUZ PRA ME SALVAR;

  ALEGRE SOU POIS SALVO ESTOU

  E ETERNAMENTE COM O SENHOR

  NAS MANSÕES CELESTIAIS IREI MORAR.


  FINAL 2X

  OH! ALELUIA,

  HONRA E GLÓRIA AO REI JESUS!

  LÁ NO CÉU ETERNAMENTE IREI CANTAR!

  ADORAREI AO MEU SENHOR,

  PROSTRADO AOS PÉS DO SALVADOR

  QUE ENTRONIZADO ESTÁ

  POIS ELE É O REI DOS REIS.

  '

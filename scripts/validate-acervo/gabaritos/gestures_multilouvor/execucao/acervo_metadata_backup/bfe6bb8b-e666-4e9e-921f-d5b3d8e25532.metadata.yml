praise_id: bfe6bb8b-e666-4e9e-921f-d5b3d8e25532
praise_name: Como é bom servir a Deus
praise_number: '046'
praise_author: A.S.L.T.
praise_rhythm: Básico
praise_tonality: A
praise_category: Crianças e Adolescentes
praise_lyrics: 'COMO É BOM SERVIR A DEUS

  CONHECÊ-LO CADA VEZ MAIS

  E VIVENDO NO SEU AMOR

  SENTIR SUA PROTEÇÃO.


  CORO 2X

  QUE ME TRAZ SEGURANÇA, VIDA,

  AMOR, PAZ E ALEGRIA.


  COM MEU DEUS EU SEI QUE SOU

  MAIS QUE VENCEDOR.

  VOU PASSANDO AS PROVAÇÕES

  FIRMADO NO SEU AMOR.

  '

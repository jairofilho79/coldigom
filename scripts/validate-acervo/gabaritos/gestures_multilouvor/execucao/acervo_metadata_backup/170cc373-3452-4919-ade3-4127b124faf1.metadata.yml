praise_id: 170cc373-3452-4919-ade3-4127b124faf1
praise_name: Tenho um Senhor muito forte
praise_number: '034'
praise_author: E.H.M.R.
praise_rhythm: Valseado
praise_tonality: B
praise_category: Crianças e Adolescentes
praise_lyrics: 'TENHO UM SENHOR MUITO FORTE, VENCEU A MORTE

  PARA ME DAR UM LUGAR LÁ NO CÉU.

  ESTE SENHOR É JESUS QUE ME CONDUZ

  PARA UM LAR DE GOZO E DE PAZ.


  QUERO SERVI-LO, QUERO LOUVÁ-LO,

  JUSTO SENHOR, DEUS FORTE, MARAVILHOSO,

  CONSELHEIRO, PAI DA ETERNIDADE,

  PRÍNCIPE DA PAZ, JESUS.

  '

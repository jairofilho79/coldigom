praise_category: Crianças e Adolescentes
praise_lyrics: "EM TUAS PISADAS \nCOLOCO OS MEUS PÉS,\nASSIM BEM FIRMADO, NÃO VACILAREI;\n\
  OS TEUS PRECEITOS, SENHOR, OS GUARDEI.\nAS TUAS PALAVRAS SÃO MEU ALIMENTO\nVIVER\
  \ NA TUA OBRA É O MEU SUSTENTO.\n\nCANTAR 2X\nQUE BOM SENHOR, CONHECER A JESUS.\n\
  CAMINHO, VIDA, VERDADE E LUZ.\n/INSTRUMENTOS\n\nEM TUAS PISADAS \nCOLOCO OS MEUS\
  \ PÉS,\nASSIM BEM FIRMADO, NÃO VACILAREI;\nOS TEUS PRECEITOS, SENHOR, OS GUARDEI.\n\
  AS TUAS PALAVRAS SÃO MEU ALIMENTO\nVIVER NA TUA OBRA É O MEU SUSTENTO.\n\nCANTAR\
  \ 2X\nQUE BOM SENHOR, CONHECER A JESUS.\nCAMINHO, VIDA, VERDADE E LUZ.\n"

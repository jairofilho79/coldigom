praise_id: 71e55e45-03a6-402e-bc03-43a8e71ae0d7
praise_name: A minha casa firme está
praise_number: '041'
praise_author: M.M.F.
praise_rhythm: Fox
praise_tonality: A
praise_category: Crianças e Adolescentes
praise_lyrics: 'A MINHA CASA FIRME ESTÁ,

  FIRMADA NA ROCHA ELA ESTÁ.

  PODEM A CHUVA E O VENTO SOPRAR,

  QUE ELA NÃO SE ABALARÁ.


  POIS ESTA CASA É O MEU CORAÇÃO,

  NELA JESUS FAZ HABITAÇÃO.

  QUERO FALAR NESTA MINHA CANÇÃO

  QUE JESUS CRISTO É A SALVAÇÃO.


  A MINHA CASA FIRME ESTÁ,

  FIRMADA NA ROCHA ELA ESTÁ.

  PODEM A CHUVA E O VENTO SOPRAR,

  QUE ELA NÃO SE ABALARÁ.


  FINAL

  POIS ESTA CASA É O MEU CORAÇÃO,

  NELA JESUS FAZ HABITAÇÃO.

  QUERO FALAR NESTA MINHA CANÇÃO

  QUE JESUS CRISTO É A SALVAÇÃO.

  '

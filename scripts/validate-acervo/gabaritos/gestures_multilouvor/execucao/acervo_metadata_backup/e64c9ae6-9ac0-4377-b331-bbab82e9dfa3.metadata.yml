praise_id: e64c9ae6-9ac0-4377-b331-bbab82e9dfa3
praise_name: Eis-me aqui, Senhor, em teu altar
praise_number: '051'
praise_author: Adriana Gomes Pereira Muniz
praise_rhythm: Básico
praise_tonality: E
praise_category: Crianças e Adolescentes
praise_lyrics: 'CANTAR 2X

  EIS-ME AQUI, SENHOR, EM TEU ALTAR,

  EIS-ME AQUI, SENHOR, PRONTO A TE ADORAR.


  CANTAR 2X

  SEI QUE A PRESENÇA DO SENHOR JESUS

  NÃO FALHARÁ,

  SEI QUE TU ESTÁS AQUI,

  PRONTO A ABENÇOAR.

  /INSTRUMENTOS


  SANTO E GLORIOSO ÉS, CONOSCO ESTÁS,

  SANTO E GLORIOSO, VIMOS TE ADORAR,

  SANTO E GLORIOSO ÉS, Ó NOSSO AMADO,

  DO TEU ESPÍRITO TENS DERRAMADO,

  DANDO RENOVO E TRANSFORMANDO;

  SANTO E GLORIOSO ÉS,

  VEM EM NÓS TRANSBORDAR,

  Ó SANTO ESPÍRITO, TOMA O TEU LUGAR.


  FINAL 2X

  SEI QUE A PRESENÇA DO SENHOR JESUS

  NÃO FALHARÁ,

  SEI QUE TU ESTÁS AQUI,

  PRONTO A ABENÇOAR.

  '

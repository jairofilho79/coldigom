praise_rhythm: Fox
praise_tonality: Em
praise_category: Crianças e Adolescentes
praise_lyrics: "TENHO UM CORAÇÃO ALEGRE\nPORQUE ESTOU NA CASA DO PAI;\nO MEU PAI CUIDA\
  \ DE MIM, \nNELE TENHO PAZ.\n\nNÃO DEIXAREI SUA CASA\nPORQUE AQUI HÁ FARTURA DE\
  \ PÃO.\nNÃO DEIXAREI JESUS\nPOIS NELE HÁ SALVAÇÃO.\n\nTENHO UM CORAÇÃO ALEGRE\n\
  PORQUE ESTOU NA CASA DO PAI;\nO MEU PAI CUIDA DE MIM,\nNELE TENHO PAZ, NELE HÁ SALVAÇÃO.\n"

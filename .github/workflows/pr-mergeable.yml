name: PR Mergeable

on:
  # develop é a branch de integração da varredura de refatoração: cada setor
  # entra por PR nela, e sem listá-la aqui esses PRs passariam sem portão.
  pull_request:
    branches: [main, develop]
  # A main recebe commit e merge direto; sem isto o portão nunca roda neles.
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: pr-mergeable-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  up_to_date_with_main:
    name: Branch atualizada com main
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verificar se origin/main é ancestral do HEAD do PR
        run: |
          set -euo pipefail
          git fetch origin main --prune
          git merge-base --is-ancestor origin/main HEAD

  api_build_test_coverage:
    name: API — build / testes / cobertura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: api/package-lock.json

      - name: Instalar dependências
        working-directory: ./api
        run: npm ci

      - name: Build
        working-directory: ./api
        run: npm run build

      - name: Testes com cobertura (catraca em vitest.config.ts)
        working-directory: ./api
        run: npm run test:coverage

      # Bloqueante desde já: o lint da api nasceu com 0 erros. Os 25
      # `no-explicit-any` herdados estão como aviso, e cada setor tipa o seu.
      - name: Lint
        working-directory: ./api
        run: npm run lint

  web_build_test_coverage:
    name: Web — build / testes / cobertura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependências
        working-directory: ./web
        run: npm ci

      - name: Build
        working-directory: ./web
        run: npm run build

      - name: Testes com cobertura (catraca em vitest.config.ts)
        working-directory: ./web
        run: npm run test:coverage

      # Informativo por ora: 38 erros herdados, todos catalogados e atribuídos
      # aos setores S5/S6/S7. Vira bloqueante quando o S6 fechar.
      - name: Lint (informativo)
        working-directory: ./web
        continue-on-error: true
        run: npm run lint

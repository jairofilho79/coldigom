  \     \nPAZ E SEGURANÇA QUERO TER\nCOM JESUS\n/FINAL\nGUIA-ME SENHOR, PELO TEU AMOR,\
  \     \nPAZ E SEGURANÇA QUERO TER\nCOM JESUS, MEU SENHOR.\n"

praise_id: 86379ef1-2524-4875-972f-965cee638504
praise_name: Do alto céu
praise_number: '050'
praise_author: F.S.P.
praise_rhythm: Novo
praise_tonality: A
praise_category: Crianças e Adolescentes
praise_lyrics: 'DO ALTO CÉU ELE ME AMOU,

  DO MUNDO MAU ME RETIROU;

  FIZ A ESCOLHA DA SALVAÇÃO,

  EU ACEITEI O CORDEIRO DE DEUS.


  SEU SANGUE LAVOU O MEU CORAÇÃO,

  DE TODO PECADO ME PERDOOU;

  SEU SANTO ESPÍRITO ME ALCANÇOU,

  E HOJE SOU SALVO PELA GRAÇA DE DEUS.

  /FINAL

  E HOJE SOU SALVO PELA GRAÇA DE DEUS.

  '

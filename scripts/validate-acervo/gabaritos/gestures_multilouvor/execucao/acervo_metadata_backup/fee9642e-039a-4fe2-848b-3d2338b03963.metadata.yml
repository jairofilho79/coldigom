praise_id: fee9642e-039a-4fe2-848b-3d2338b03963
praise_name: Jesus, o melhor amigo
praise_number: '119'
praise_author: A.V.
praise_rhythm: Marcha
praise_tonality: G
praise_category: Crianças e Adolescentes
praise_lyrics: 'JESUS, O MELHOR AMIGO,

  QUE SEMPRE ESTÁ PRESENTE.

  NELE HÁ PODER PARA MUDAR O CRENTE.


  CORO 2X

  MESMO EM LUTAS E AFLIÇÕES

  ELE RESPONDE ÀS NOSSAS ORAÇÕES.


  JESUS TEM PODER.

  MESMO EM GUERRAS E BATALHAS

  VOCÊ VAI VENCER, PORQUE JESUS NÃO FALHA.

  SE VOCÊ QUISER UMA BÊNÇÃO,

  BASTA SOMENTE CRER.

  É SÓ PEDIR A ELE QUE VOCÊ VAI RECEBER.

  '

praise_id: dca80154-ab4c-4c3e-9d2e-f838b9fb812f
praise_name: Vinde, meninos
praise_number: '103'
praise_author: 'Let. e Mús.: George Frederick Root; Adap. Sarah Paulton Kalley'
praise_rhythm: Fox
praise_tonality: G
praise_category: Crianças e Adolescentes
praise_lyrics: 'VINDE, MENINOS, VINDE A JESUS!

  ELE GANHOU-VOS BÊNÇÃOS NA CRUZ,

  OS PEQUENINOS ELE CONDUZ,

  Ó VINDE AO SALVADOR!


  CORO

  QUE ALEGRIA! SEM PECADO OU MAL

  REUNIR-NOS TODOS, AFINAL,

  NA SANTA PÁTRIA CELESTIAL

  COM NOSSO SALVADOR.


  JÁ SEM DEMORA, HOJE CONVÉM

  IR CAMINHANDO À GLÓRIA ALÉM;

  JESUS VOS CHAMA, QUER VOSSO BEM,

  Ó VINDE AO SALVADOR!


  CRISTO VOS AMA, BEM ELE O DIZ,

  QUER RECEBER-VOS NO BOM PAÍS;

  QUER CONCEDER-VOS VIDA FELIZ,

  Ó VINDE AO SALVADOR!

  '

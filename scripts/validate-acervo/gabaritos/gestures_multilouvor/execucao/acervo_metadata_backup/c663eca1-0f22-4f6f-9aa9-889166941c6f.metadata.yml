praise_name: Esta canção
praise_number: '230'
praise_author: R.T.F.
praise_rhythm: Básico
praise_tonality: A
praise_category: Crianças e Adolescentes
praise_lyrics: 'ESTA CANÇÃO É PARA TI, JESUS,

  DO MEU CORAÇÃO

  TIREI ESTE LOUVOR:

  /CANTAR 2X

  MEU DEUS BENDITO,

  GLÓRIA, GLÓRIA.


  O MEU LOUVOR PERTENCE SÓ A TI,

  TEUS ANJOS SEMPRE LOUVAM,

  A ELES VOU ME UNIR.


  FINAL 2X

  PRA SEMPRE, GLÓRIA,

  GLÓRIA, GLÓRIA;

  '

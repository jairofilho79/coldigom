praise_id: c4209d2f-cd90-419d-8bcf-56399b458d16
praise_name: É teu sangue, meu Senhor Jesus
praise_number: '007'
praise_author: J.J.G.
praise_rhythm: Básico
praise_tonality: A
praise_category: Crianças e Adolescentes
praise_lyrics: 'É TEU SANGUE, MEU SENHOR JESUS,

  QUE GARANTE A NOSSA COMUNHÃO.

  É TEU SANGUE, MEU SENHOR JESUS,

  QUE NOS TRAZ LIBERTAÇÃO.

  /FINAL 2X

  POR ISSO VOU CLAMAR

  E O SENHOR VAI ME PURIFICAR

  E PRONTO ESTAREI

  PRA SERVIR NA CASA DO MEU REI!

  '

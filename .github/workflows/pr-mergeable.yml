name: PR Mergeable

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-mergeable-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  up_to_date_with_main:
    name: Branch atualizada com main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verificar se origin/main é ancestral do HEAD do PR
        run: |
          set -euo pipefail
          git fetch origin main --prune
          git merge-base --is-ancestor origin/main HEAD

  api_build_test_coverage:
    name: API — build / testes / cobertura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: api/package-lock.json

      - name: Instalar dependências
        working-directory: ./api
        run: npm ci

      - name: Build
        working-directory: ./api
        run: npm run build

      - name: Testes com cobertura (≥ 95%)
        working-directory: ./api
        run: npm run test:coverage

  web_build_test_coverage:
    name: Web — build / testes / cobertura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependências
        working-directory: ./web
        run: npm ci

      - name: Build
        working-directory: ./web
        run: npm run build

      - name: Testes com cobertura (≥ 95%)
        working-directory: ./web
        run: npm run test:coverage

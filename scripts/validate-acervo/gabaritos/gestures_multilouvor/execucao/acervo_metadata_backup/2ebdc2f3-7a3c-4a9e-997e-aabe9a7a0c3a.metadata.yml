praise_name: Muitos motivos tenho
praise_number: '237'
praise_author: J.L.M.M.
praise_rhythm: Básico
praise_tonality: F
praise_category: Crianças e Adolescentes
praise_lyrics: 'MUITOS MOTIVOS TENHO

  PARA TE ADORAR, OH, DEUS!

  TU ÉS PARA MIM O MARAVILHOSO,

  O PRÍNCIPE DA PAZ.


  *CORO

  JESUS, TU ÉS PARA MIM O DEUS FIEL,

  MARAVILHOSO,

  OUTRO DEUS COMO O SENHOR NÃO HÁ.

  /INSTRUMENTOS


  HOJE AQUI ESTOU A TE GLORIFICAR

  PELAS BÊNÇÃOS RECEBIDAS,

  POR TUDO O QUE ME FAZ.


  *CORO 2X

  JESUS,

  TU ÉS PARA MIM O DEUS FIEL,

  MARAVILHOSO

  OUTRO DEUS COMO O SENHOR NÃO HÁ.

  /FINAL 2X

  OUTRO DEUS COMO O SENHOR NÃO HÁ.

  '

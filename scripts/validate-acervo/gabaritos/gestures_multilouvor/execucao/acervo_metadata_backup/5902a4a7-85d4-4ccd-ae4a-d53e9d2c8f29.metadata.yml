praise_id: 5902a4a7-85d4-4ccd-ae4a-d53e9d2c8f29
praise_name: No caminho, ele me guiará
praise_number: '104'
praise_author: J. Camargo Jr
praise_rhythm: Fox
praise_tonality: E
praise_category: Crianças e Adolescentes
praise_lyrics: 'NO CAMINHO ELE ME GUIARÁ,

  ELE QUER BEM A TODO PECADOR,

  O SEU AMOR POR MIM, VOCÊ OUVIU?

  DEUS GOSTA DE VOCÊ.


  CORO

  DEUS GOSTA DE VOCÊ (2X)

  O SEU AMOR VOCÊ VERÁ

  POR TODA A PARTE QUE OLHAR;

  DEUS GOSTA DE VOCÊ.


  O SOL DOURADO ELE FAZ NASCER,

  AS LINDAS FLORES ELE FAZ ABRIR,

  QUANDO O DESERTO CHORA A CHUVA CAI,

  DEUS GOSTA DE VOCÊ.

  '

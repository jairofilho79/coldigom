praise_name: Faze oração
praise_number: '022'
praise_author: Anônimo
praise_rhythm: Balada
praise_tonality: D
praise_category: Crianças e Adolescentes
praise_lyrics: 'FAZE ORAÇÃO BEM CEDINHO,

  AO MEIO-DIA, SIM, TAMBÉM;

  FAZE ORAÇÃO À NOITINHA,

  QUE É DEUS QUE TE SUSTÉM.


  JÁ DE MANHÃ DEUS ESCUTA,

  AO MEIO-DIA, SIM, TAMBÉM;

  MESMO TE VÊ À NOITINHA,

  DE TUDO TE SUSTÉM.


  JÁ DE MANHÃ DEUS RESPONDE,

  AO MEIO-DIA, SIM, TAMBÉM;

  FAZE ORAÇÃO À NOITINHA,

  POIS ELE LOGO VEM.

  '

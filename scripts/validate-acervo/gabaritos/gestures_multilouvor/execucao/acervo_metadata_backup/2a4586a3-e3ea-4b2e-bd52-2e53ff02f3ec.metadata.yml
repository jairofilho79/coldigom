praise_id: 2a4586a3-e3ea-4b2e-bd52-2e53ff02f3ec
praise_name: O Senhor é a minha luz e a minha salvação
praise_number: 078
praise_author: J.J.G.
praise_rhythm: Fox
praise_tonality: D
praise_category: Crianças e Adolescentes
praise_lyrics: 'CANTAR 2X

  O SENHOR É A MINHA LUZ

  E A MINHA SALVAÇÃO,

  A QUEM EU TEMEREI?

  DE QUEM ME RECEAREI?


  BOM E RETO É O SENHOR,

  POIS APONTA O CAMINHO AO PECADOR.

  NELE HÁ O PERDÃO,

  NELE ESPERO TODO DIA. (3X)

  '

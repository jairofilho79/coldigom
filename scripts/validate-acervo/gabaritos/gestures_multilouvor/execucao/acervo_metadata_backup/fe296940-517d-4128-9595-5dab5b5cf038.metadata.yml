praise_name: Sei que na cruz seu sangue verteu
praise_number: '061'
praise_author: L.P.S.
praise_rhythm: Fox
praise_tonality: D
praise_category: Crianças e Adolescentes
praise_lyrics: 'SEI QUE NA CRUZ SEU SANGUE VERTEU,

  MORREU ALI MEU SENHOR,

  MAS NO TERCEIRO DIA RESSUCITOU

  PRA ME DAR O CÉU DE AMOR.


  EU QUERO JESUS QUE ME SALVA (3X)

  COM ELE QUERO IR AO CÉU.


  LÁ NO CÉU, (3X)

  QUERO MORAR COM MEU JESUS.

  LÁ NO CÉU, (3X)

  QUERO MORAR COM MEU JESUS.



praise_id: 88f66bed-c07d-4250-85d8-d90714ef8d89
praise_name: Sonhei com Jesus esta noite
praise_number: 096
praise_author: Waldemar Bourguignon
praise_rhythm: Balada
praise_tonality: G
praise_category: Crianças e Adolescentes
praise_lyrics: 'SONHEI COM JESUS ESTA NOITE,

  UM CONSELHO ELE ME DEU:

  /CANTAR 2X

  "NÃO SIGAS POR OUTRO CAMINHO

  QUE A PORTA DO CÉU SOU EU."


  EU IMPLOREI A JESUS:

  SENHOR, TEM DE MIM COMPAIXÃO,

  /CANTAR 2X

  EU VIVO VAGANDO NO MUNDO

  SEM PAZ, SEM CONSOLAÇÃO.


  UMA VOZ ME FALOU BAIXINHO

  NO FUNDO DO CORAÇÃO:

  /CANTAR 2X

  "Ó, PECADOR, VEM DEPRESSA,

  CRISTO TE DÁ SALVAÇÃO."

  '

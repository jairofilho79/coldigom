praise_name: Jesus Cristo é o caminho
praise_number: '106'
praise_author: G.G.P.
praise_rhythm: Valseado
praise_tonality: D
praise_category: Crianças e Adolescentes
praise_lyrics: 'JESUS CRISTO É O CAMINHO

  E O GUIA DE VALOR;

  ELE SALVA TODO AQUELE

  QUE CONFIA EM SEU AMOR,


  JESUS CRISTO É O CAMINHO,

  JESUS CRISTO ME SALVOU,

  /FINAL 2X

  EU FUI SALVO PELA GRAÇA

  QUE EM MIM DEPOSITOU

  '

praise_id: 73ae1bf6-dde1-485e-8ad0-4550f82d8964
praise_name: Eu sou uma ovelhinha de Jesus
praise_number: '026'
praise_author: M.C.H.O.
praise_rhythm: Fox
praise_tonality: D
praise_category: Crianças e Adolescentes
praise_lyrics: 'EU SOU UMA OVELHINHA DE JESUS.

  EU SOU UMA OVELHINHA DE JESUS.

  JESUS É O BOM PASTOR,

  JESUS CUIDA DE MIM

  EU SOU UMA OVELHINHA DO SENHOR.


  BEM CEDO AO LEVANTAR EU VOU ORAR,

  AGRADECER A NOITE QUE ME DEU;

  EU LOUVOR COM AMOR

  E DIGO SEMPRE ASSIM:

  EU SOU UM PEQUENINO DO SENHOR. (2X)

  '

praise_id: c24cb986-e6a1-4eb3-bbd3-6e3c473fee12
praise_name: Existem segredos na tua palavra
praise_number: '160'
praise_author: M.L.M.B.O.
praise_rhythm: Repique
praise_tonality: D
praise_category: Crianças e Adolescentes
praise_lyrics: 'EXISTEM SEGREDOS NA TUA PALAVRA

  QUE SÓ TEU ESPÍRITO PODE REVELAR.

  ENSINOS DE VIDA, DE FELICIDADE,

  CAMINHO DE LUZ QUE JESUS VEIO NOS DAR.


  É LIVRO SELADO, MISTÉRIO GUARDADO,

  QUE O HOMEM SEM DEUS NÃO PODE ALCANÇAR.

  É LIVRO ABERTO, CLARO, DESCOBERTO,

  /CANTAR 2X

  PARA OS SERVOS FIÉIS

  QUE COM JESUS VÃO REINAR.

  '

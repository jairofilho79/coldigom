praise_id: 75721372-eee7-4e79-ad93-bd3829526ec8
praise_name: Clamo, ó Senhor
praise_number: '004'
praise_author: E.H.M.R.
praise_rhythm: Balada
praise_tonality: E
praise_category: Crianças e Adolescentes
praise_lyrics: 'CLAMO, Ó SENHOR, PELO SANGUE DE JESUS,

  NA TUA PRESENÇA LIMPO QUERO ESTAR,

  E SÓ LAVADO NESTE SANGUE

  NO SANTO DOS SANTOS POSSO ENTRAR.

  (2X)

  LAVA-ME, SENHOR

  VISITA-ME SENHOR,

  COM O ESPÍRITO SANTO

  O CONSOLADOR

  TEREI PLENA COMUNHÃO

  E A TUA PROTEÇÃO

  '

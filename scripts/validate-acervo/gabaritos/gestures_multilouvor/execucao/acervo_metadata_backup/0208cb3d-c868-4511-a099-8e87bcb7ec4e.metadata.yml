praise_id: 0208cb3d-c868-4511-a099-8e87bcb7ec4e
praise_name: Eu vim aqui, Senhor
praise_number: '225'
praise_author: J.L.M.M.
praise_rhythm: Básico
praise_tonality: D
praise_category: Crianças e Adolescentes
praise_lyrics: 'EU VIM AQUI, SENHOR, PARA AGRADECER

  POR TUDO O QUE TENS FEITO POR MIM;

  ALEGRE ESTOU POR MAIS UM DIA

  NA TUA PRESENÇA, Ó DEUS.


  CORO 2X

  GLÓRIA A JESUS,

  MARAVILHOSO ÉS PRA MIM,

  ÉS FORTE E PODEROSO

  E CUMPRE SUAS PROMESSAS.


  O MEU PRAZER É TE LOUVAR

  PORQUE O SENHOR É FIEL;

  EU SEI QUE APENAS PEQUENO SOU,

  MAS SIRVO A TI POR AMOR.

  '

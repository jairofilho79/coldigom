praise_id: 96f59a47-a46b-41dd-90ca-9f56681df147
praise_name: Hoje eu não quero pedir
praise_number: '232'
praise_author: C.M.V.
praise_rhythm: Marcha
praise_tonality: Bm
praise_category: Crianças e Adolescentes
praise_lyrics: 'HOJE EU NÃO QUERO PEDIR NADA A TI,

  EU SÓ QUERO LOUVAR, MEU SENHOR,

  POIS GRANDES COISAS FIZESTE POR MIM,

  POR ISSO ALEGRE ESTOU.


  A NOITE JÁ ACABOU, FOI-SE A DOR,

  A ALEGRIA VOLTOU EM LOUVOR;

  TUA PALAVRA É FIEL, CREIO ASSIM,

  POR ISSO ALEGRE ESTOU.

  '

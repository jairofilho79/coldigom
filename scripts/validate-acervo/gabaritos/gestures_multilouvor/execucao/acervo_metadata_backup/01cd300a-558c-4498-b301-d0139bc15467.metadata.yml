praise_id: 01cd300a-558c-4498-b301-d0139bc15467
praise_name: Como uma folha ao vento
praise_number: '142'
praise_author: M.L.M.B.O.
praise_rhythm: Balada
praise_tonality: D
praise_category: Crianças e Adolescentes
praise_lyrics: 'COMO UMA FOLHA AO VENTO

  VOA PRA LÁ E PRA CÁ,

  EU TAMBÉM QUERO ESTAR

  AONDE O ESPÍRITO SANTO MANDAR.


  NÃO FAÇO MAIS O QUE EU QUERO,

  MAS O QUE DEUS REVELAR;

  COMO UMA FOLHA AO VENTO,

  VOANDO VAI SEMPRE ONDE O VENTO SOPRAR,

  /FINAL 2X

  EU TAMBÉM QUERO ESTAR

  AONDE O ESPÍRITO SANTO MANDAR.

  '

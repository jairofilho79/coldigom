praise_id: a35e06a1-a6f5-4760-9ec8-1c2227efa9ac
praise_name: É somente teu meu coração
praise_number: '055'
praise_author: Cristina Manera Vianna
praise_rhythm: Básico 2
praise_tonality: D
praise_category: Crianças e Adolescentes
praise_lyrics: 'É SOMENTE TEU MEU CORAÇÃO, SENHOR,

  É SOMENTE TEU MEU CORPO E MEU LOUVOR;

  É SOMENTE TEU, MEU PAI, O MEU AMOR,

  SOU SOMENTE TEU, MEU REDENTOR.


  QUERO TE AMAR, MEU DEUS, Ó MEU SENHOR,

  QUERO TE ADORAR, PRA SEMPRE, COM ARDOR;

  QUERO A TI ORAR COM FÉ E COM FERVOR,

  SOU SOMENTE TEU, MEU REDENTOR.

  '

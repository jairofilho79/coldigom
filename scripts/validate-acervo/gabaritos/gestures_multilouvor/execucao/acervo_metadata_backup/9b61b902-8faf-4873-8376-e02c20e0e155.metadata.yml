praise_id: 9b61b902-8faf-4873-8376-e02c20e0e155
praise_name: Jesus é a nossa vitória
praise_number: '239'
praise_author: ''
praise_rhythm: Toada
praise_tonality: A
praise_category: Crianças e Adolescentes
praise_lyrics: 'JESUS É A NOSSA VITÓRIA

  ELE NOS LEVA PARA A SUA GLÓRIA

  NOS GUARDA DE TODO O PERIGO

  JESUS É NOSSO GRANDE AMIGO.


  EU SOU FELIZ, POIS CONHECI A JESUS

  E HOJE EU CAMINHO EM SUA LUZ

  NA ETERNIDADE COM JESUS VOU MORAR

  E COM OS ANJOS PARA SEMPRE O ADORAR:


  VIVA O REI, VIVA O REI

  VIVA O REI, VIVA O REI

  VIVA O REI,

  VIVA O REI JESUS!

  VIVA O REI JESUS!

  '

praise_name: Senhor, Deus tu és varão de guerra
praise_number: '236'
praise_author: E.A.JR.
praise_rhythm: Repique
praise_tonality: D
praise_category: Crianças e Adolescentes
praise_lyrics: 'SENHOR DEUS,

  TU ÉS VARÃO DE GUERRA

  E VENCE AS BATALHAS POR NÓS,

  O SOL DETÉNS SE NECESSIDADE IMPERA

  E TUDO OUVE A TUA VOZ.


  NÃO HÁ INIMIGO PODEROSO.

  MAJESTOSO TU ÉS, DEUS FORTE, VITORIOSO,

  E TUDO ESTÁ AOS TEUS PÉS.


  SENHOR DEUS,


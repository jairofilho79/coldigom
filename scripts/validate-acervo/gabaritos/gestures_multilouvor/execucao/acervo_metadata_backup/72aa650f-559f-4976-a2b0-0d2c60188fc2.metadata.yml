praise_name: Tenho algo pra você
praise_number: 091
praise_author: P.L.C.
praise_rhythm: Fox
praise_tonality: G
praise_category: Crianças e Adolescentes
praise_lyrics: 'TENHO ALGO PRA VOCÊ NESTA CANÇÃO:

  TEM ALGUÉM QUE MORA EM MEU CORAÇÃO.

  ESTE ALGUÉM DESEJA DAR A VOCÊ O PERDÃO.


  FINAL 2X

  ESTE ALGUÉM É MUITO IMPORTANTE!

  ESTÁ BEM PERTO DE VOCÊ

  A TODO INSTANTE.

  ELE SÓ POR NÓS MORREU NUMA CRUZ.

  ESTE ALGUÉM, LHE DIGO, É: JESUS!

  '

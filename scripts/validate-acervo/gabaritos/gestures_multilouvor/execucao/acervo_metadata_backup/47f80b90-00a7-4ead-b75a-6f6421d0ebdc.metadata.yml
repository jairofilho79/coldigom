praise_id: 47f80b90-00a7-4ead-b75a-6f6421d0ebdc
praise_name: Sou o santo
praise_number: '171'
praise_author: N.R.R.A.
praise_rhythm: Básico
praise_tonality: G
praise_category: Crianças e Adolescentes
praise_lyrics: 'CANTAR 2X

  SOU O SANTO, O VERDADEIRO,

  TENHO A CHAVE DE DAVI;

  A PORTA ABERTA ESTÁ,

  PRA QUE POSSAS ME ADORAR!


  GUARDASTE AS MINHAS PALAVRAS,

  NÃO NEGASTE O MEU NOME;

  TAMBÉM EU TE GUARDAREI,

  EIS QUE VENHO SEM DEMORA.


  FINAL 2X

  ENTÃO, GUARDA O QUE TENS,

  PARA QUE NINGUÉM

  TOME A TUA COROA.

  '

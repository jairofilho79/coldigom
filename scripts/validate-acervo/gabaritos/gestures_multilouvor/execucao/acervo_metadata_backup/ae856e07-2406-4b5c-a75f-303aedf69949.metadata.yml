praise_id: ae856e07-2406-4b5c-a75f-303aedf69949
praise_name: Um certo pastorzinho
praise_number: '175'
praise_author: Autor Desconhecido
praise_rhythm: Fox
praise_tonality: E
praise_category: Crianças e Adolescentes
praise_lyrics: 'UM CERTO PASTORZINHO, QUE SE CHAMOU DAVI,

  ERA MUI PEQUENO, NÃO CONFIAVA EM SI;

  ELE, COM OUSADIA, ORANDO SEMPRE A DEUS,

  FOI ENFRENTAR, UM DIA, O HERÓI DOS FILISTEUS.


  NA FUNDA UMA PEDRA COLOCOU,

  E GIROU, GIROU, GIROU;

  NA FUNDA UMA PEDRA COLOCOU,

  E GIROU, GIROU, GIROU;


  MAIS UMA VEZ, MAIS OUTRA VEZ,

  MAIS UMA VEZ GIROU,

  E A PEDRA ATIROU, O ALVO ACERTOU,

  E O GIGANTE AO CHÃO TOMBOU!

  '

praise_id: 5d72a585-e246-4671-86fe-a54189d34a29
praise_name: Jerusalém, cidade do meu Rei
praise_number: '181'
praise_author: E.H.M.R.
praise_rhythm: Country
praise_tonality: Gm
praise_category: Crianças e Adolescentes
praise_lyrics: 'JERUSALÉM, CIDADE DO MEU REI,

  A CADA DIA ANSEIO ESTAR ALI;

  CONTEMPLAREI A FACE DO SENHOR,

  AQUELE QUE ENTREGOU

  SUA VIDA POR MIM.


  CANTAR 2X

  JAMAIS A MORTE VEREI,

  POIS VIDA ETERNA ALCANCEI

  QUANDO ENTREGUEI

  MEU CORAÇÃO PARA JESUS.

  '

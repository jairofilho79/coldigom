praise_id: 52991aa9-4a8d-4709-9863-806d5d3ff1d5
praise_name: Aquele que tem sede
praise_number: 094
praise_author: E.H.M.R.
praise_rhythm: Fox
praise_tonality: Dm
praise_category: Crianças e Adolescentes
praise_lyrics: "AQUELE QUE TEM SEDE\nVÁ À FONTE E BEBA,\nSUAS ÁGUAS DESSEDENTAM\n\
  E TRAZEM VIDA.\n\nRIOS DE ÁGUAS CORRERÃO \nNO SEU INTERIOR,\nE A ALEGRIA QUE SALTA\n\
  PARA A VIDA ETERNA.\n\nJESUS É ESSA FONTE DE VIDA,\nQUE SACIA A SEDE DA ALMA.\n\
  VENHA A ELE E BEBA,\nE UMA VIDA ETERNA LHE DARÁ.\n\nAQUELE QUE TEM SEDE\nVÁ À FONTE\
  \ E BEBA,\nSUAS ÁGUAS DESSEDENTAM\nE TRAZEM VIDA.\n\nFINAL\nRIOS DE ÁGUAS CORRERÃO\
  \ \nNO SEU INTERIOR,\nE A ALEGRIA QUE SALTA\nPARA A VIDA ETERNA.\n"

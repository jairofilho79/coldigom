praise_id: 7f8fd0d5-6896-44ca-a8b8-fd6247af4ef0
praise_name: Um dia morreu o meu Jesus
praise_number: 086
praise_author: A.V.
praise_rhythm: Toada
praise_tonality: D
praise_category: Crianças e Adolescentes
praise_lyrics: "UM DIA MORREU O MEU JESUS\nNAQUELA CRUZ POR MIM,\nO SANGUE DERRAMADO\
  \ \nLIMPOU OS MEUS PECADOS.\nEU VOU CANTAR, \nPORQUE JESUS ESTÁ AQUI.\n\n*CORO\n\
  AGORA MEU JESUS VOU ADORAR,\nEU VOU CANTAR (EU VOU CANTAR)\nEU VOU LOUVAR COMO DAVI\n\
  AO DERROTAR OS QUE QUERIAM O ATINGIR.\n/INSTRUMENTOS\n\nJESUS, EU QUERO A MINHA\
  \ VIDA TE ENTREGAR\nE QUERO MAIS A TUA OBRA REALIZAR,\nSERVI-LO SEMPRE DE TODO O\
  \ CORAÇÃO\nE SEMPRE EU CANTAREI ESTA CANÇÃO.\n\n*CORO 2X\nAGORA MEU JESUS VOU ADORAR,\n\
  EU VOU CANTAR (EU VOU CANTAR)\nEU VOU LOUVAR COMO DAVI\nAO DERROTAR OS QUE QUERIAM\
  \ O ATINGIR.\n"

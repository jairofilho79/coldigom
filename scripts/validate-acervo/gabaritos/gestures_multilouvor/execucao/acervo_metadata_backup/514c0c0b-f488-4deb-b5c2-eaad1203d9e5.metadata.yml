praise_id: 514c0c0b-f488-4deb-b5c2-eaad1203d9e5
praise_name: Tu és pra mim um vaso escolhido
praise_number: '161'
praise_author: E.H.M.R.
praise_rhythm: Valseado
praise_tonality: A
praise_category: Crianças e Adolescentes
praise_lyrics: 'TU ÉS PRA MIM UM VASO ESCOLHIDO,

  TU ÉS PRA MIM UM VASO DE VALOR.

  EU TE CHAMEI PARA SALVAR TUA VIDA,

  EU SOU JESUS, O TEU SENHOR.


  TU ÉS PRA MIM UM VASO ESCOLHIDO,

  TU ÉS PRA MIM UM VASO DE VALOR.

  PARA LEVAR MEU NOME A TANTAS GENTES

  E TESTEMUNHAR DO MEU AMOR.


  *CORO 2X

  VAI, FALA E ANUNCIA

  JESUS QUER O HOMEM TRANSFORMAR.

  OS DIAS PASSAM, O TEMPO FINDA,

  JESUS TEM PRESSA E VAI VOLTAR!

  /FINAL

  JESUS TEM PRESSA E VAI VOLTAR!

  '

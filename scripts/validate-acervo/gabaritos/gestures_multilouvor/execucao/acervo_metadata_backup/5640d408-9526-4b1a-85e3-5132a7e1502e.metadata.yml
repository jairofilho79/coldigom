praise_id: 5640d408-9526-4b1a-85e3-5132a7e1502e
praise_name: Uma ovelhinha de Jesus eu sou
praise_number: '024'
praise_author: C.M.V.C.S.
praise_rhythm: Country
praise_tonality: D
praise_category: Crianças e Adolescentes
praise_lyrics: 'UMA OVELHINHA DE JESUS EU SOU,

  SEMPRE ESTÁ COMIGO, É MEU BOM PASTOR;

  ME MOSTRA O CAMINHO EM QUE DEVO ANDAR,

  É MEU AMADO SALVADOR.


  ME LIVRA DO PERIGO,

  ESTENDE O SEU CAJADO,

  É MEU MELHOR AMIGO,

  DO MAL ESTOU GUARDADO.

  EM TODA A MINHA VIDA EU O AMAREI,

  E PARA SEMPRE VIVEREI COM JESUS.

  /FINAL

  E PARA SEMPRE VIVEREI COM JESUS.

  '

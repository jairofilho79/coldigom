praise_id: 170cb30f-c5ec-4554-920a-04b34820335a
praise_name: Lâmpada para os meus pés
praise_number: '136'
praise_author: M.L.M.B.O.; F.B.O.G.
praise_rhythm: Básico
praise_tonality: G
praise_category: Crianças e Adolescentes
praise_lyrics: 'LÂMPADA PARA MEUS PÉS,

  O CAMINHO ILUMINA,

  REVELADA POR DEUS,

  GUIARÁ O MEU CORAÇÃO.


  CORO

  A BÍBLIA É UM TESOURO DESCOBERTO

  PARA AQUELES QUE DE JESUS ESTÃO PERTO;

  A MINHA BÍBLIA VOU SEMPRE LER

  PARA MAIS DE JESUS CONHECER.


  QUERO AMAR TUA PALAVRA,

  GUARDÁ-LA SEMPRE EM MEU CORAÇÃO,

  ENSINAR AS PESSOAS

  QUE SÓ JESUS É A SALVAÇÃO.

  '

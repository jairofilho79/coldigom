praise_id: d4a87c56-6f72-4bfe-a89c-a4fcd8a522b7
praise_name: Quando falo com Deus
praise_number: '017'
praise_author: M.C.H.O.
praise_rhythm: Novo
praise_tonality: C
praise_category: Crianças e Adolescentes
praise_lyrics: "QUANDO FALO COM DEUS, AS LÁGRIMAS CORREM,\nA SUA PRESENÇA ME ENVOLVE\
  \ TÃO FORTE, \nEM PAZ ME DEITO, PEGO NO SONO,\nPOIS EM SEUS BRAÇOS EU DESCANSO;\n\
  BEM CEDO ACORDO E ME LEVANTO,\nPOIS SEI QUE JESUS ME SUSTENTOU.\n/INSTRUMENTOS\n\
  \nQUANDO FALO COM DEUS, A LUZ ME ENVOLVE,\nTRANSPORTO PARA ETERNIDADE,\nESTOU NO\
  \ PLANO DE DEUS;\nPEÇO TODO DIA, AO MEU SENHOR\nQUE SALVE A MINHA FAMÍLIA\nPRA JUNTOS\
  \ LOUVARMOS AO BOM PASTOR\nQUE CUIDA DE NÓS COM AMOR. (2X)\n"

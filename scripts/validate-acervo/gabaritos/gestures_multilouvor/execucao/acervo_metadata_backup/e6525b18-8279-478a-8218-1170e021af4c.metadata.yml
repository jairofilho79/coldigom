praise_name: A Jesus irei louvar
praise_number: '227'
praise_author: L.E.C.T.M. & E.H.M.R.
praise_rhythm: Valseado
praise_tonality: F
praise_category: Crianças e Adolescentes
praise_lyrics: 'A JESUS IREI LOUVAR,

  POIS NA CRUZ SE DEU POR MIM.

  O SEU SANGUE DERRAMOU,

  MEU PECADO CARREGOU;

  TODA DOR ELE LEVOU,

  FOI QUEM PRIMEIRO ME AMOU.


  FINAL 2X

  COM QUERUBINS E SERAFINS

  A JESUS IREI LOUVAR,

  ALELUIA! GLÓRIA A DEUS!

  LÁ NO CÉU EU VOU MORAR.

  '

praise_id: c113f5a7-682d-4b1b-abda-f7fdce2ecde3
praise_name: Há uma linda morada
praise_number: '185'
praise_author: M.L.M.B.O; F.B.O.G.
praise_rhythm: Fox Abafado
praise_tonality: D
praise_category: Crianças e Adolescentes
praise_lyrics: 'HÁ UMA LINDA MORADA PRA MIM NO CÉU

  QUE JESUS FOI ALI PREPARAR;

  UM LUGAR DE DELÍCIAS E AMOR SEM FIM,

  COM JESUS VOU PRA SEMPRE MORAR.


  FINAL 2X

  NA CIDADE DE DEUS,

  NOVA JERUSALÉM,

  ONDE O SOL NÃO PRECISA BRILHAR;

  O CORDEIRO É A LUZ

  QUE ILUMINA A CIDADE

  ONDE VOU PARA SEMPRE MORAR.

  '

praise_name: Jesus, vem me abençoar
praise_number: '015'
praise_author: L.G.A.M.
praise_rhythm: Guarânia
praise_tonality: F
praise_category: Crianças e Adolescentes
praise_lyrics: 'JESUS, VEM ME ABENÇOAR,

  SENTIR A TUA FACE.

  JESUS, VEM FICAR PERTINHO,

  DAS CRIANÇAS VEM CUIDAR.


  FINAL 2X

  JESUS É MEU, (3X)

  É ELE QUEM CUIDA DE MIM.

  '

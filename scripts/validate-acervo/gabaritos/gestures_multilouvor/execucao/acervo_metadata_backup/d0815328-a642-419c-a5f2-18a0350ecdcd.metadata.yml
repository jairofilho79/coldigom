praise_id: d0815328-a642-419c-a5f2-18a0350ecdcd
praise_name: Disse Jesus aos Judeus (Eu trabalho também)
praise_number: '178'
praise_author: A.C.J.
praise_rhythm: Fox
praise_tonality: E
praise_category: Crianças e Adolescentes
praise_lyrics: 'DISSE JESUS AOS JUDEUS,

  ASSIM JESUS LHES RESPONDEU:

  "O MEU PAI TRABALHA ATÉ AGORA,

  EU TRABALHO TAMBÉM!


  EU TRABALHO TAMBÉM,

  EU TRABALHO TAMBÉM,

  O MEU PAI TRABALHA ATÉ AGORA,

  E EU TRABALHO TAMBÉM!"


  CONVÉM QUE EU FAÇA AS MESMAS OBRAS

  DAQUELE QUE ME ENVIOU,

  ENQUANTO É DIA, A NOITE VEM

  QUANTO NÃO SE PODE TRABALHAR,

  O MEU PAI TRABALHA ATÉ AGORA,

  EU TRABALHO TAMBÉM!


  QUERO TRABALHAR TAMBÉM,

  QUERO TRABALHAR TAMBÉM,

  COM O ESPÍRITO SANTO EM MINHA VIDA,

  QUERO TRABALHAR TAMBÉM!

  '

praise_id: c7e16bde-ad36-4e3f-8b3d-7561dc16e740
praise_name: Poderá cantar
praise_number: '120'
praise_author: C.A.
praise_rhythm: Básico
praise_tonality: D
praise_category: Crianças e Adolescentes
praise_lyrics: 'CORO

  PODERÁ CANTAR QUEM NA ROCHA ESTIVER,

  PODERÁ CANTAR,

  POIS COM JESUS FIRMADO ESTARÁ.


  ESPEREI PELO SENHOR COM PACIÊNCIA

  E ME FIRMOU OS PASSOS,

  DE ESCORREGAR LIVROU-ME,

  DEU-ME UM NOVO CANTO.


  O CORAÇÃO FIRME EM CRISTO

  POR VENDAVAIS NÃO VACILARÁ,

  NÃO EM AREIA, MAS NA ROCHA,

  OUVE SUA VOZ, QUE SEGURANÇA!

  '

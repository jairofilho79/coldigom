praise_id: 15e5425e-8d04-40c0-82e0-36e96f082ebd
praise_name: Você sabe o que é salvação
praise_number: 069
praise_author: E.H.M.R.
praise_rhythm: Balada
praise_tonality: G
praise_category: Crianças e Adolescentes
praise_lyrics: 'VOCÊ SABE O QUE É SALVAÇÃO?

  É SENTIR UMA GRANDE ALEGRIA

  QUE O MUNDO NÃO CONHECE,

  NELE HÁ TREVAS E SOLIDÃO.


  JESUS NOS DEU SALVAÇÃO

  QUANDO LÁ NA CRUZ MORREU,

  LEVOU OS NOSSOS PECADOS,

  LIBERTOS AGORA ESTAMOS.


  CANTAR 2X

  DÊ A ELE O SEU LOUVOR,

  UMA VIDA DE GRATIDÃO;

  VEM AGORA E ENTREGUE

  A JESUS SEU CORAÇÃO.

  /FINAL

  VEM AGORA E ENTREGUE

  A JESUS SEU CORAÇÃO.

  '

praise_category: Crianças e Adolescentes
praise_lyrics: 'CRISTO É VITÓRIA!

  PROCLAMAI COM REAL PRAZER;

  CRISTO É VITÓRIA!

  E COM ELE VAMOS NÓS VENCER!


  SE FALTAR PRAZER E LUZ,

  TUDO NOS DÁ JESUS,

  TEMOS VITÓRIA

  POR QUEM JÁ VENCEU NA CRUZ.


  CRISTO É VITÓRIA!

  PROCLAMAI COM REAL PRAZER;

  CRISTO É VITÓRIA!

  E COM ELE VAMOS NÓS VENCER!


  SE FALTAR PRAZER E LUZ,

  TUDO NOS DÁ JESUS,

  TEMOS VITÓRIA

  POR QUEM JÁ VENCEU NA CRUZ.

  /FINAL

  POR QUEM JÁ VENCEU NA CRUZ.

  '

praise_id: dfbbd172-ed42-4dac-b479-99d80529f4ae
praise_name: Viver é tão lindo
praise_number: 058
praise_author: Jackson de Halley Fernandes Fontes
praise_rhythm: Básico
praise_tonality: D
praise_category: Crianças e Adolescentes
praise_lyrics: 'VIVER É TÃO LINDO QUANDO SE TEM JESUS,

  O MUNDO É TÃO PEQUENO

  PARA O QUE EU TENHO EM MIM;

  E O QUE EU TENHO

  É BEM MAIOR QUE TUDO NA VIDA,

  EU TENHO É JESUS.


  VIVO A CANTAR, VIVO A SORRIR,

  TUDO O QUE EU TENHO

  JAMAIS SE ACABARÁ.

  '

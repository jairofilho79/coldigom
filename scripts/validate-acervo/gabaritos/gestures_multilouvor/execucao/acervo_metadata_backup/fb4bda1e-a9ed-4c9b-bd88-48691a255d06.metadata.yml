praise_id: fb4bda1e-a9ed-4c9b-bd88-48691a255d06
praise_name: Quando Israel saiu do Egito
praise_number: '023'
praise_author: J.S.M.
praise_rhythm: Country
praise_tonality: Dm
praise_category: Crianças e Adolescentes
praise_lyrics: "QUANDO ISRAEL SAIU DO EGITO, \nISRAEL CANTOU, CANTOU:\nO SENHOR É\
  \ A MINHA FORÇA.\n/ELE ME FOI POR SALVAÇÃO, \nESTE É O MEU DEUS,\nLHE FAREI UMA\
  \ HABITAÇÃO.\n\nAO SENHOR TAMBÉM LOUVAREI\nPORQUE É A MINHA SALVAÇÃO,\nMEU REFÚGIO,\
  \ MINHA FORTALEZA,\nLHE FAREI UMA HABITAÇÃO\nNO MEU CORAÇÃO\n/INSTRUMENTOS\n\nQUANDO\
  \ ISRAEL SAIU DO EGITO, \nISRAEL CANTOU, CANTOU:\nO SENHOR É A MINHA FORÇA.\n/ELE\
  \ ME FOI POR SALVAÇÃO, \nESTE É O MEU DEUS,\nLHE FAREI UMA HABITAÇÃO.\n\nAO SENHOR\
  \ TAMBÉM LOUVAREI\nPORQUE É A MINHA SALVAÇÃO,\nMEU REFÚGIO, MINHA FORTALEZA,\nLHE\
  \ FAREI UMA HABITAÇÃO\nNO MEU CORAÇÃO\n\nFINAL\nQUANDO ISRAEL SAIU DO EGITO, \n\
  ISRAEL CANTOU, CANTOU:\nO SENHOR É A MINHA FORÇA.\n"

praise_id: 8bb2d131-426f-4d46-a4ce-d1cae8a8f580
praise_name: Sou servo do Senhor
praise_number: '044'
praise_author: C.M.V.C.S.
praise_rhythm: Balada
praise_tonality: A
praise_category: Crianças e Adolescentes
praise_lyrics: 'SOU SERVO DO SENHOR,

  SERVI-LO É O MEU PRAZER,

  POIS SALVO EM SUA GRAÇA,

  POR SEU FILHO JESUS,

  TORNOU-ME LIVRE.

  EM JESUS POSSO IR DIRETO AO PAI,

  COM OUSADIA ENTRAR

  NO SANTO DOS SANTOS.


  COMO REI E SACERDOTE

  O SENHOR ME COLOCOU.

  POSSO GOVERNAR, POSSO MINISTRAR,

  AO SENHOR SEMPRE ADORAR,

  EM ESPÍRITO E VERDADE

  HOJE E ETERNAMENTE.


  SOU SERVO DO SENHOR,

  SERVI-LO É O MEU PRAZER,

  POIS SALVO EM SUA GRAÇA,

  POR SEU FILHO JESUS,

  TORNOU-ME LIVRE.

  EM JESUS POSSO IR DIRETO AO PAI,

  COM OUSADIA ENTRAR

  NO SANTO DOS SANTOS.


  COMO REI E SACERDOTE

  O SENHOR ME COLOCOU.

  POSSO GOVERNAR, POSSO MINISTRAR,

  AO SENHOR SEMPRE ADORAR,

  EM ESPÍRITO E VERDADE

  HOJE E ETERNAMENTE.

  /FINAL

  HOJE E ETERNAMENTE.

  '

praise_name: Onde nasceu Jesus
praise_number: '065'
praise_author: R.T.F.
praise_rhythm: Fox
praise_tonality: D
praise_category: Crianças e Adolescentes
praise_lyrics: 'ONDE NASCEU JESUS?

  EU LOGO TE RESPONDO:

  EM BELÉM, O MEU JESUS NASCEU.


  QUEM É SEU PAI?

  EU LOGO TE RESPONDO:

  DE DEUS É FILHO E ELE TAMBÉM É DEUS.


  EM QUE CIDADE CRESCEU?

  EU LOGO TE RESPONDO:

  EM NAZARÉ O MEU JESUS CRESCEU.


  QUEM O BATIZOU?

  EU LOGO TE RESPONDO:

  FOI JOÃO BATISTA, NO RIO JORDÃO.


  E DIGO MAIS, ELE ESTÁ VIVO,

  FALA CONOSCO,

  NOS TRAZENDO A PAZ.

  '

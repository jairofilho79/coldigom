praise_id: 8246e73b-843b-47da-8a49-a7486c0a6699
praise_name: Sei que sou amado do meu Salvador
praise_number: '234'
praise_author: C.M.V.C.S.
praise_rhythm: Fox Abafado
praise_tonality: D
praise_category: Crianças e Adolescentes
praise_lyrics: "SEI QUE SOU AMADO \nDO MEU SALVADOR,\nSEI QUE ESTOU GUARDADO\nPELO\
  \ SEU AMOR.\n\nDIA A DIA CAMINHANDO\nESTOU INDO A JERUSALÉM.\nSEGUINDO O MEU JESUS\
  \ EU SEI\nQUE EM BREVE CHEGAREI.\n\nCORO\nSOU FELIZ COM MEU SENHOR,(2X)\nDIA A DIA\
  \ CAMINHANDO\nESTOU, INDO A JERUSALÉM,\nSEGUINDO MEU JESUS,\nEU SEI QUE EM BREVE\
  \ CHEGAREI.\n\nNAS MANSÕES CELESTIAIS IREI MORAR,\nCOM OS ANJOS DO SENHOR IREI CANTAR;\n\
  SEU AMOR JESUS MOSTROU POR MIM,\nUM POBRE PECADOR, EM MEU LUGAR\nMORREU NA CRUZ,\
  \ AGORA SALVO ESTOU.\n"

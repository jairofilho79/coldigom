praise_id: eab1163a-1c6a-4878-9136-2e965fb558ba
praise_name: Estou aqui pra confessar
praise_number: '005'
praise_author: E.E.M.R.
praise_rhythm: Valseado
praise_tonality: G
praise_category: Crianças e Adolescentes
praise_lyrics: 'ESTOU AQUI PRA CONFESSAR

  A TI OS MEUS PECADOS

  PRECISO DO TEU PERDÃO,

  DA TUA COMUNHÃO


  ESTOU AQUI PRA TE PEDIR:

  LIMPA MEU CORAÇÃO,

  COMO A BRANCA LÃ

  TORNA-O, SENHOR.


  SUSTENTA-ME EM TUAS MÃOS, JESUS,

  PROTEGIDO EM TEUS BRAÇOS QUERO ESTAR;

  ESCONDE-ME DE TODA A MALDADE

  E SEMPRE CONTIGO VOU ANDAR. (2X)

  '

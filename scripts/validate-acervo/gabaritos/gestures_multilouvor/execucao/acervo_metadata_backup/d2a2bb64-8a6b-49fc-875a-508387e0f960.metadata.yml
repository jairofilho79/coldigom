praise_name: Tu és o Cristo, filho do Deus vivo
praise_number: '072'
praise_author: E.H.M.R.
praise_rhythm: Balada
praise_tonality: A
praise_category: Crianças e Adolescentes
praise_lyrics: 'CANTAR 2X

  TU ÉS O CRISTO,

  O FILHO DO DEUS VIVO,

  NOSSO SALVADOR, JESUS, NOME DOCE;

  MORRESTE NA CRUZ PRA NOS SALVAR,

  RESSUSCITASTE E NO CÉU ESTÁS,

  VOLTARÁS E NOS LEVARÁS

  PARA CONTIGO HABITAR.

  '

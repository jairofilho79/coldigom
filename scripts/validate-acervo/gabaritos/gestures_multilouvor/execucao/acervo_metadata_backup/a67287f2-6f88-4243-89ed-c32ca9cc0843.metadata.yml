praise_id: a67287f2-6f88-4243-89ed-c32ca9cc0843
praise_name: Diante do teu altar
praise_number: 008
praise_author: J.J.G.
praise_rhythm: Básico
praise_tonality: G
praise_category: Crianças e Adolescentes
praise_lyrics: "DIANTE DO TEU ALTAR, SENHOR,\nOS MEUS JOELHOS VOU DOBRAR\nE POR TEU\
  \ SANGUE VOU CLAMAR,\nPEDINDO: VEM PURIFICAR\nO MEU CORAÇÃO,\nQUE ESPERA EM TI COM\
  \ GRATIDÃO!\n\nCANTAR 2X\nEU CLAMO PELA VIDA, \nA VIDA QUE HÁ EM TI, JESUS!\nPELO\
  \ PODER DO SANGUE\nVERTIDO NA CRUZ!\n/INSTRUMENTOS\n\nDIANTE DO TEU ALTAR, SENHOR,\n\
  OS MEUS JOELHOS VOU DOBRAR\nE POR TEU SANGUE VOU CLAMAR,\nPEDINDO: VEM PURIFICAR\n\
  O MEU CORAÇÃO,\nQUE ESPERA EM TI COM GRATIDÃO!\n\nFINAL 2X\nEU CLAMO PELA VIDA,\
  \ \nA VIDA QUE HÁ EM TI, JESUS!\nPELO PODER DO SANGUE\nVERTIDO NA CRUZ!\n"

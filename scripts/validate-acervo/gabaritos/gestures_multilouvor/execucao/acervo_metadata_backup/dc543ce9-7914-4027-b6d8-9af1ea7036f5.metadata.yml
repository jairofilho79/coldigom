praise_id: dc543ce9-7914-4027-b6d8-9af1ea7036f5
praise_name: Jesus nos prometeu
praise_number: '196'
praise_author: S.G.D.
praise_rhythm: Marcha Marcial
praise_tonality: D
praise_category: Crianças e Adolescentes
praise_lyrics: 'JESUS NOS PROMETEU

  QUE VIRÁ NOS BUSCAR.

  ESTE MUNDO PASSARÁ,

  TODO MAL FINDARÁ.


  CORO

  O TOQUE DA TROMBETA OUVIREMOS,

  O ANJO DO SENHOR A TOCARÁ.

  NAS NUVENS CELESTIAIS

  IREMOS ENCONTRAR JESUS.


  QUE GOZO E ALEGRIA HAVERÁ.

  A NOIVA DO SENHOR ARREBATADA IRÁ.

  COM JESUS PARA SEMPRE ESTARÁ.

  '

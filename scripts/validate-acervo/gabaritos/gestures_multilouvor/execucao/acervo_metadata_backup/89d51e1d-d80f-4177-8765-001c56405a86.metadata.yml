praise_name: Minha vida e meu coração
praise_number: '042'
praise_author: C.M.V.C.S.
praise_rhythm: Fox
praise_tonality: E
praise_category: Crianças e Adolescentes
praise_lyrics: 'MINHA VIDA E MEU CORAÇÃO PERTENCEM A JESUS,

  DIA A DIA EM MEU VIVER VOU ANDAR EM SUA LUZ.

  À PALAVRA VOU OBEDECER,

  COM AMOR TESTEMUNHAR.


  E PRA SEMPRE, SEMPRE O LOUVAREI,

  NA ETERNIDADE EU VOU MORAR.

  E PRA SEMPRE, SEMPRE O LOUVAREI,

  NA ETERNIDADE EU VOU MORAR.

  '
